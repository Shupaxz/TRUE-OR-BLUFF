#qcard .qsparks{display:none}

/* ===== v10: fix clipped tone mark on มั่ว ===== */
.atab > span{padding-top:6px;box-sizing:border-box;font-size:clamp(20px,2.45vw,28px)}
.toprow .tabs3{margin-bottom:2px}
.atab .tx{line-height:1.15}

/* ===== v10: PIN ===== */
.pinbox{position:relative;width:min(440px,100%);box-sizing:border-box;padding:24px 22px 18px;border-radius:18px;text-align:center;overflow:hidden;
  background:var(--diam),radial-gradient(120% 80% at 50% 0%,#1d4fd8,#050f3e 70%);background-size:34px 34px,auto;border:2px solid var(--gold);
  box-shadow:0 0 0 1px #7a4f08,0 24px 70px rgba(0,0,0,.65),0 0 44px rgba(245,197,66,.25);animation:pop .45s cubic-bezier(.2,1.1,.3,1)}
.pb-glow{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:conic-gradient(from 0deg,transparent 0 72%,rgba(255,244,184,.22) 82%,transparent 92%);animation:spin 6s linear infinite;pointer-events:none}
.pinbox > *:not(.pb-glow){position:relative}
.pinbox h2{margin:2px 0 2px;font-family:var(--disp);font-weight:800;font-size:28px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pinbox .sub{margin:0 0 6px;color:#c9d6ff;font-size:14px}
.pb-emblem{width:72px;height:72px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2451d6,#061552 70%);box-shadow:0 0 0 3px var(--gold),0 0 0 6px #7a4f08,0 0 26px rgba(245,197,66,.5);animation:embF 3s ease-in-out infinite}
@keyframes embF{50%{transform:translateY(-4px)}}
.pb-emblem svg{width:40px;height:40px;overflow:visible}
.pb-emblem .sh{transform-box:fill-box;transform-origin:100% 100%;transition:transform .45s cubic-bezier(.2,1.6,.3,1)}
.pinbox.ok .pb-emblem .sh{transform:translateY(-5px) rotate(-28deg)}
.pinbox.ok .pb-emblem{box-shadow:0 0 0 3px #8dff6e,0 0 0 6px #0c5a22,0 0 34px rgba(141,255,110,.8)}
.pinbox .pin-in{gap:12px;margin:14px 0 6px}
.pinbox .pin-in input{width:64px;height:80px;border-radius:12px;border:2px solid rgba(245,197,66,.45);background:linear-gradient(180deg,#020616,#0b1a52);color:#ffe27a;font-size:42px;text-shadow:0 0 14px rgba(245,197,66,.8);caret-color:transparent;transition:border-color .2s,box-shadow .2s,color .3s,transform .2s}
.pinbox .pin-in input:focus{border-color:#fff4b8;box-shadow:0 0 0 4px rgba(245,197,66,.22),0 0 24px rgba(245,197,66,.55);animation:slotPulse 1.3s ease-in-out infinite}
@keyframes slotPulse{50%{box-shadow:0 0 0 6px rgba(245,197,66,.12),0 0 30px rgba(245,197,66,.35)}}
.pinbox .pin-in input.pop{animation:digitPop .38s cubic-bezier(.2,1.8,.3,1)}
@keyframes digitPop{0%{transform:scale(1.35) rotateX(60deg);filter:brightness(2)}100%{transform:none}}
.pinbox.shake .pin-in{animation:shakeX .45s}
.pinbox.shake .pin-in input{border-color:#ff5a4a;color:#ffb0a0;box-shadow:0 0 18px rgba(255,60,60,.5)}
@keyframes shakeX{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pinbox.ok .pin-in input{border-color:#8dff6e;color:#d6ffd0;text-shadow:0 0 14px #8dff6e;box-shadow:0 0 22px rgba(141,255,110,.6);transform:translateY(-4px);transition-delay:calc(var(--k) * 80ms)}
.pinbox .err{min-height:20px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:270px;margin:8px auto 4px}
.keypad button{height:50px;border-radius:14px;font-family:var(--num);font-weight:700;font-size:22px;display:grid;place-items:center;background:linear-gradient(180deg,#2451d6,#0f2a8c);box-shadow:0 4px 0 #061552,inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(245,197,66,.35);transition:transform .08s,box-shadow .08s,filter .2s}
.keypad button:hover{filter:brightness(1.2)}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #061552,inset 0 0 0 1px rgba(245,197,66,.6)}
.keypad svg{width:24px;height:24px}
.keypad .kdel{background:linear-gradient(180deg,#f04a4a,#b0131f);box-shadow:0 4px 0 #5a0810,inset 0 1px 0 rgba(255,255,255,.3)}
.keypad .kok{background:var(--goldgrad);color:#2a1800;box-shadow:0 4px 0 #6b4506,inset 0 1px 0 rgba(255,255,255,.5)}
.keypad .kok:disabled{opacity:.5}

/* ===== v10: question builder ===== */
.editor{width:min(1000px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:2px solid var(--gold);
  background:var(--diam),linear-gradient(180deg,#0d2a8a,#030824 70%);background-size:40px 40px,auto;box-shadow:0 0 0 1px #7a4f08,0 30px 80px rgba(0,0,0,.7),0 0 50px rgba(245,197,66,.2);animation:edIn .5s cubic-bezier(.2,1.1,.3,1)}
@keyframes edIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.ed-head{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;padding:18px 22px 14px;border-bottom:1px solid rgba(245,197,66,.28);background:linear-gradient(180deg,rgba(40,90,230,.45),transparent)}
.ed-head h2{margin:4px 0 2px;font-family:var(--disp);font-weight:800;font-size:28px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ed-head .sub{margin:0;max-width:56ch;font-size:13px;color:#c9d6ff}
.ed-head .genbar{margin:0}
.ed-body{flex:1;min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr)}
.etabs{display:flex;flex-direction:column;gap:7px;padding:14px 12px;border-right:1px solid rgba(245,197,66,.2);overflow:auto;background:rgba(0,0,0,.22)}
.etab{position:relative;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;text-align:left;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(120,170,255,.22);transition:background .25s,box-shadow .25s,transform .2s;animation:etabIn .45s both;animation-delay:calc(var(--i) * 50ms)}
@keyframes etabIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.etab:hover{transform:translateX(3px);box-shadow:inset 0 0 0 1px rgba(245,197,66,.55)}
.etab .eh{width:32px;height:32px;display:grid;place-items:center;font-family:var(--num);font-weight:700;color:#2a1800;background:var(--goldgrad);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.etab .et b{display:block;font-family:var(--disp);font-size:15px;line-height:1.2}
.etab .et small{font-family:var(--num);font-size:12px;color:var(--gold)}
.etab .ec{min-width:26px;padding:2px 7px;border-radius:999px;font-family:var(--num);font-weight:700;font-size:12px;text-align:center;background:rgba(223,31,46,.3);color:#ffb0a0}
.etab.ok .ec{background:rgba(31,191,69,.3);color:#b8ffa8}
.etab.on{background:linear-gradient(90deg,rgba(245,197,66,.26),rgba(245,197,66,.04));box-shadow:inset 0 0 0 1px var(--gold),0 0 20px rgba(245,197,66,.22)}
.etab.on::before{content:"";position:absolute;left:-12px;top:20%;bottom:20%;width:4px;border-radius:2px;background:var(--goldgrad);box-shadow:0 0 10px #f5c542}
.ed-main{min-height:0;padding:14px 18px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.tinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;font-size:13px;color:#c9d6ff}
.tinfo b{font-family:var(--num);color:#b8ffa8}
.tinfo.warn b{color:#ffe27a}
.tinfo em{flex-basis:100%;font-style:normal;color:#ffe27a;font-size:12px}
.meter{flex:1;min-width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#1fbf45,#8dff6e);box-shadow:0 0 10px rgba(141,255,110,.6);transition:width .5s cubic-bezier(.2,1,.3,1)}
.tinfo.warn .meter i{background:linear-gradient(90deg,#d99a1a,#ffe27a)}
.qlist{gap:10px}
.qcardE{position:relative;display:grid;grid-template-columns:34px minmax(0,1fr) 136px 32px;gap:12px;align-items:stretch;padding:12px;border-radius:12px;background:linear-gradient(180deg,rgba(35,80,215,.38),rgba(5,15,62,.65));box-shadow:inset 0 0 0 1px rgba(120,170,255,.25);transition:box-shadow .25s,transform .25s}
.qcardE:hover{box-shadow:inset 0 0 0 1px rgba(245,197,66,.6),0 8px 22px rgba(0,0,0,.35);transform:translateY(-1px)}
.qcardE:focus-within{box-shadow:inset 0 0 0 2px var(--gold),0 0 26px rgba(245,197,66,.25)}
.qcardE.gen{animation:rowIn .5s cubic-bezier(.2,1.3,.3,1) both}
.qcardE.out{animation:rowOut .24s ease-in forwards}
@keyframes rowOut{to{opacity:0;transform:translateX(40px) scale(.95)}}
.qnum{align-self:start;width:32px;height:32px;display:grid;place-items:center;font-family:var(--num);font-weight:700;color:#2a1800;background:var(--goldgrad);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.qmain textarea{width:100%;box-sizing:border-box;min-height:60px;resize:vertical;padding:9px 11px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid rgba(120,170,255,.28);color:#fff;font:inherit;font-size:15px;line-height:1.5;transition:border-color .2s,box-shadow .2s}
.qmain textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.18)}
.qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tfseg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.tfseg button{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:999px;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--muted);transition:background .25s,color .25s,box-shadow .25s}
.tfseg svg{width:14px;height:14px}
.tfseg .t.on{background:linear-gradient(180deg,#5de86a,#1fbf45);color:#fff;box-shadow:0 0 14px rgba(141,255,110,.55)}
.tfseg .f.on{background:linear-gradient(180deg,#ff6a52,#df1f2e);color:#fff;box-shadow:0 0 14px rgba(255,90,74,.55)}
.imgbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-family:var(--disp);font-size:13px;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(245,197,66,.5);cursor:pointer;transition:background .2s}
.imgbtn:hover{background:rgba(245,197,66,.14)}
.imgbtn svg{width:16px;height:16px}
.qimg{position:relative;min-height:84px;border-radius:10px;border:2px dashed rgba(120,170,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;background:rgba(0,0,0,.28);color:rgba(170,200,255,.6);cursor:pointer;transition:border-color .2s,background .2s}
.qimg svg{width:30px;height:30px}
.qimg small{font-size:11px;text-align:center;padding:0 6px}
.qimg:hover,.qimg.drag{border-color:var(--gold);background:rgba(245,197,66,.1);color:var(--gold)}
.qimg.has{border:2px solid var(--gold);box-shadow:0 0 16px rgba(245,197,66,.3)}
.qimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:imgIn .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes imgIn{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:none}}
.rmimg{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:16px;line-height:1;display:grid;place-items:center}
.rmimg:hover{background:var(--red)}
.qcardE .del{align-self:start}
.addq{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;margin:0;border-radius:12px;border:2px dashed rgba(245,197,66,.55);color:var(--gold);font-family:var(--disp);font-size:16px;transition:background .2s,box-shadow .2s}
.addq:hover{background:rgba(245,197,66,.1);box-shadow:0 0 20px rgba(245,197,66,.2)}
.ed-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 22px;border-top:1px solid rgba(245,197,66,.28);background:rgba(0,0,0,.28)}
@media (max-width:760px){
  .ed-body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .etabs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid rgba(245,197,66,.2);padding:10px}
  .etab{flex:none;grid-template-columns:28px auto auto}
  .etab.on::before{display:none}
  .qcardE{grid-template-columns:30px minmax(0,1fr) 30px}
  .qimg{grid-column:2/3;grid-row:2;min-height:110px}
}

/* ===== v10: question picture (player) ===== */
.qpic{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translateX(-50%);width:min(500px,calc(100% - 360px));pointer-events:none;z-index:3}
.qpic .qp-rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,140,.16) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 55%);mask:radial-gradient(circle,#000 12%,transparent 55%);opacity:0;z-index:-1}
.qpic.in .qp-rays{animation:spin 16s linear infinite,pfxFade .8s .3s both}
.qp-frame{position:relative;padding:5px;border-radius:14px;background:var(--goldgrad);box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 34px rgba(245,197,66,.35);opacity:0;transform:perspective(900px) rotateX(-80deg) scale(.7);transform-origin:50% 0}
.qpic.in .qp-frame{animation:picIn .9s cubic-bezier(.2,1.2,.3,1) forwards,picFloat 4s 1s ease-in-out infinite}
@keyframes picIn{60%{opacity:1;transform:perspective(900px) rotateX(10deg) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes picFloat{0%,100%{transform:none}50%{transform:translateY(-6px)}}
.qp-in{position:relative;border-radius:10px;overflow:hidden;background:var(--diam),linear-gradient(180deg,#1a47c9,#050f3e);background-size:30px 30px,auto;display:grid;place-items:center}
.qp-in img{display:block;max-width:100%;max-height:36vh;object-fit:contain}
.qp-in::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%)}
.qpic.in .qp-in::after{animation:sheen 1.4s .8s ease-in-out}
.qp-tag{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);padding:3px 14px;border-radius:999px;font-style:normal;font-family:var(--disp);font-weight:700;font-size:12px;color:#2a1800;background:var(--goldgrad);white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.4)}
@media (max-width:860px){.qpic{top:calc(env(safe-area-inset-top,0px) + 132px);width:min(360px,calc(100% - 32px))}.qp-in img{max-height:24vh}}

/* ===== v10: question picture (MC) ===== */
.hpic{position:relative;margin:0 0 14px;padding:18px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--diam),radial-gradient(80% 90% at 50% 40%,#2458e0,#050f3e 75%);background-size:30px 30px,auto;box-shadow:inset 0 0 0 2px rgba(245,197,66,.55)}
.hpic .hp-rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,230,140,.14) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 50%);mask:radial-gradient(circle,#000 10%,transparent 50%)}
.hpic.in .hp-rays{animation:spin 18s linear infinite}
.hp-frame{position:relative;padding:4px;border-radius:10px;background:var(--goldgrad);box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 26px rgba(245,197,66,.3);opacity:0;transform:scale(.6) rotate(-4deg)}
.hpic.in .hp-frame{animation:hpIn .8s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes hpIn{to{opacity:1;transform:none}}
.hp-frame img{display:block;max-width:100%;max-height:260px;border-radius:7px;object-fit:contain;background:#020616}
.hp-lbl{position:absolute;left:12px;top:10px;padding:3px 10px;border-radius:999px;font-family:var(--disp);font-weight:700;font-size:12px;color:#2a1800;background:var(--goldgrad)}

@media (max-width:980px){
  .hv-body{grid-template-columns:1fr}
}
@media (max-width:860px){
  .stairs{right:16px;left:16px;width:auto;top:calc(env(safe-area-inset-top,0px) + 66px);bottom:auto;flex-direction:row;align-items:flex-end;gap:4px}
  .stairs .st{margin-left:0;flex:1;height:calc(26px + var(--i) * 8px);grid-template-columns:1fr;justify-items:center;align-content:space-between;padding:5px 2px;gap:1px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}

  .qbox{order:1;min-height:70px;padding-right:0}
  .tbox{position:absolute;right:12px;top:-118px;width:120px;height:0}
  .thouse{right:0;bottom:auto;top:0;width:128px;height:112px}
  .thouse .disp{width:48px;height:66px;right:8px;top:9px}
  .thouse .lbl{display:none}
  .seg7 .dg{width:32px;height:56px}

  .tabs3{align-self:flex-start;margin-left:12px}
}
@media (max-width:520px){
  .info .in{gap:8px;font-size:13px;padding:6px 10px}
  .info .qn,.info .sep.s2{display:none}
  .atab{width:104px;height:48px}
  .atab > span{font-size:22px}
  .orlock{width:70px;height:38px}
  .orlock > span{font-size:14px}
  .llm{width:60px}
  .llm .disc{width:52px;height:52px}

  .llm b{font-size:11px}
  .kgrid{grid-template-columns:1fr 1fr}

  .lrow > span{width:90px}
  .bigpin span{width:54px;height:70px;font-size:38px}
  .pin-in input{width:52px;height:64px}
  .vsw .lab{display:none}
}
body.rm *,body.rm *::before,body.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

/* ===== v11: clean tab letters (no filter artifacts) ===== */
.tabs3.shown .atab .lt{animation:ltIn2 .55s cubic-bezier(.2,1.6,.3,1) both,ltGlow3 2.6s 1s ease-in-out infinite}
@keyframes ltIn2{0%{opacity:0;transform:translateY(-34px) scale(1.8)}100%{opacity:1;transform:none}}
@keyframes ltGlow3{0%,100%{text-shadow:0 0 0 rgba(255,255,255,0)}50%{text-shadow:0 0 10px rgba(255,255,255,.75)}}
/* ===== v11: picture sits above the lifelines, calm entrance ===== */
.qpic{left:16px;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 238px);transform:none;width:min(340px,30vw)}
.qpic .qp-rays{display:none}
.qp-frame{transform:translateY(22px) scale(.96);transform-origin:50% 100%}
.qpic.in .qp-frame{animation:picIn2 .7s cubic-bezier(.25,.8,.3,1) forwards,picGlow 1.4s .5s ease-in-out}
@keyframes picIn2{to{opacity:1;transform:none}}
@keyframes picGlow{50%{box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 46px rgba(245,197,66,.75)}}
.qp-in img{max-height:30vh}
.qp-tag{left:12px;bottom:auto;top:-11px;transform:none}
.qpic.in .qp-in::after{animation:sheen 1.2s .55s ease-in-out}
@media (max-width:860px){.qpic{left:50%;transform:translateX(-50%);bottom:auto;top:calc(env(safe-area-inset-top,0px) + 132px);width:min(320px,calc(100% - 32px))}.qp-in img{max-height:22vh}}

/* ===== v12: lobby network status ===== */
.netrow{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:13px;color:#d6e0ff}
.netdot{width:10px;height:10px;border-radius:50%;background:#8a93b8;flex:none}
.netrow:has([data-s="connecting"]) .netdot{background:var(--gold);animation:blink 1s infinite}
.netrow:has([data-s="online"]) .netdot{background:#8dff6e;box-shadow:0 0 10px #8dff6e}
.netrow:has([data-s="local"]) .netdot{background:#ff8a70}
.sharerow{display:flex;gap:8px;margin-bottom:4px}
.sharerow input{flex:1;min-width:0;padding:9px 10px;border-radius:6px;border:1px solid rgba(245,197,66,.4);background:rgba(0,0,0,.35);color:#d6e0ff;font:inherit;font-size:13px}

/* ===== v13: saved sets / import ===== */
.menu-btns{width:min(1080px,100%)}
.mbtn:nth-child(4){animation-delay:.24s}
.iobar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 22px;border-bottom:1px solid rgba(245,197,66,.2);background:rgba(3,10,48,.55)}
.setname{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 200px;padding:6px 12px;border-radius:8px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(141,255,110,.35);transition:box-shadow .3s}
.setname b{font-family:var(--disp);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.setname small{color:#8dff6e;font-size:12px;white-space:nowrap}
.setname .sdot{width:9px;height:9px;border-radius:50%;flex:none;background:#8dff6e;box-shadow:0 0 8px #8dff6e}
.setname.dirty{box-shadow:inset 0 0 0 1px rgba(245,197,66,.35)}.setname.dirty small{color:var(--gold)}.setname.dirty .sdot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.setname.flash{animation:snFlash 1s ease-out}
@keyframes snFlash{0%{box-shadow:inset 0 0 0 2px #fff4b8,0 0 0 0 rgba(141,255,110,.7)}100%{box-shadow:inset 0 0 0 1px rgba(141,255,110,.35),0 0 0 14px rgba(141,255,110,0)}}
.iobtns{display:flex;flex-wrap:wrap;gap:6px}
.iob{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:7px;font-family:var(--disp);font-size:14px;color:#d6e0ff;background:rgba(20,50,160,.45);box-shadow:inset 0 0 0 1px rgba(120,170,255,.35);cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s}
.iob svg{width:17px;height:17px;flex:none}
.iob:hover{background:rgba(40,90,230,.6);box-shadow:inset 0 0 0 1px rgba(245,197,66,.6);transform:translateY(-1px)}
.iob:active{transform:translateY(1px)}
.iob.pri{background:var(--goldgrad);color:#2a1800;box-shadow:none;font-weight:700}
.iob:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.savebar{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:linear-gradient(90deg,rgba(245,197,66,.16),rgba(245,197,66,.04));box-shadow:inset 0 0 0 1px rgba(245,197,66,.4);animation:sbIn .3s cubic-bezier(.2,1.2,.3,1)}
.savebar label{font-family:var(--disp);color:var(--gold);font-size:14px}
.savebar input{flex:1 1 180px;min-width:0;padding:9px 12px;border-radius:7px;border:1px solid rgba(245,197,66,.5);background:rgba(0,0,0,.4);color:#fff;font:inherit;font-size:15px}
.savebar input:focus{outline:none;border-color:#fff4b8;box-shadow:0 0 0 3px rgba(245,197,66,.25)}
.savebar .btn{font-size:14px;padding:8px 14px}
@keyframes sbIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.editor,.libbox{position:relative}
.dropzone{position:absolute;inset:8px;border-radius:14px;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(3,10,48,.82);border:3px dashed var(--gold);z-index:5}
.dropzone.on{opacity:1}
.dz-in{display:grid;justify-items:center;gap:6px;text-align:center;transform:scale(.92);transition:transform .25s cubic-bezier(.2,1.4,.3,1)}
.dropzone.on .dz-in{transform:none}
.dz-in svg{width:64px;height:64px;color:var(--gold);animation:dzBob 1.2s ease-in-out infinite}
.dz-in b{font-family:var(--disp);font-size:24px;color:#fff4b8}.dz-in small{color:var(--muted)}
@keyframes dzBob{50%{transform:translateY(-6px)}}
.qlist.scan{position:relative}
.libbox{width:min(920px,100%);max-height:90vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:2px solid var(--gold);background:radial-gradient(120% 80% at 50% 0%,rgba(40,90,230,.55),transparent 60%),linear-gradient(180deg,#0a1d6e,#040c38);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(245,197,66,.2);animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
.lib-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 16px;padding:18px 22px 14px;border-bottom:1px solid rgba(245,197,66,.28)}
.lib-head h2{margin:4px 0 2px;font-family:var(--disp);font-weight:800;font-size:28px;color:var(--gold)}
.lib-head .sub{margin:0;max-width:52ch;font-size:13px;color:#c9d6ff}
.lib-list{flex:1;min-height:180px;overflow:auto;padding:16px 22px;display:grid;gap:12px;align-content:start}
.lib-list.scan{animation:libScan .9s linear infinite}
@keyframes libScan{50%{filter:brightness(1.25)}}
.lcard{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(180deg,rgba(35,80,215,.4),rgba(5,15,62,.7));box-shadow:inset 0 0 0 1px rgba(120,170,255,.28);animation:lcIn .5s calc(var(--k)*60ms) cubic-bezier(.2,1.2,.3,1) both;transition:box-shadow .25s,transform .25s}
.lcard:hover{box-shadow:inset 0 0 0 1px rgba(245,197,66,.7),0 8px 24px rgba(0,0,0,.35);transform:translateY(-2px)}
.lcard.fresh{animation:lcIn .5s cubic-bezier(.2,1.2,.3,1) both,lcFresh 1.6s .3s ease-out}
.lcard.out{animation:lcOut .3s ease-in forwards}
@keyframes lcIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes lcOut{to{opacity:0;transform:translateX(40px) scale(.95)}}
@keyframes lcFresh{0%{box-shadow:inset 0 0 0 2px #fff4b8,0 0 0 0 rgba(245,197,66,.8)}100%{box-shadow:inset 0 0 0 1px rgba(120,170,255,.28),0 0 0 18px rgba(245,197,66,0)}}
.lc-art{position:relative;width:84px;height:64px;border-radius:9px;overflow:hidden;background:var(--goldgrad);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.lc-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lc-mono{font-family:var(--disp);font-weight:800;font-size:34px;color:#3a2400}
.lc-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);transition:transform .7s}
.lcard:hover .lc-shine{transform:translateX(120%)}
.lc-body{min-width:0;display:grid;gap:3px}
.lc-name{font-family:var(--disp);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-meta{color:var(--muted);font-size:12.5px}
.lc-bars{display:flex;gap:4px;margin-top:4px}
.lc-bars .tb{position:relative;width:26px;height:22px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.lc-bars .tb i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#ff8a70,#ffb49f);transition:height .5s}
.lc-bars .tb.ok i{background:linear-gradient(0deg,#1b8f3c,#8dff6e)}
.lc-bars .tb.fin.ok i{background:linear-gradient(0deg,#b9800f,#fff4b8)}
.lc-bars .tb em{position:relative;display:block;text-align:center;font-style:normal;font-size:11px;line-height:22px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000}
.lc-act{display:flex;gap:6px;align-items:center}
.lc-act .btn{font-size:14px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px}
.lc-act svg{width:16px;height:16px}
.lc-play{animation:lcPulse 2.4s ease-in-out infinite}
@keyframes lcPulse{50%{filter:brightness(1.18) drop-shadow(0 0 8px rgba(245,197,66,.6))}}
.lc-del.arm{background:#b0131f;color:#fff}
.lib-empty{display:grid;justify-items:center;gap:6px;padding:40px 10px;text-align:center;color:var(--muted)}
.lib-empty svg{width:56px;height:56px;color:var(--gold);opacity:.8}
.lib-empty b{font-family:var(--disp);font-size:20px;color:#fff}
.lib-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-top:1px solid rgba(245,197,66,.28);background:rgba(0,0,0,.28)}
.lib-foot .fmt{color:var(--muted);font-size:12px}
@media (max-width:640px){
  .lcard{grid-template-columns:64px minmax(0,1fr)}
  .lc-art{width:64px;height:52px}
  .lc-act{grid-column:1/-1;flex-wrap:wrap}.lc-act .lc-play{flex:1;justify-content:center}
  .iob span{font-size:13px}
  .lib-foot{flex-direction:column;align-items:stretch}
}
</style>

function gYear(tight){const e=pick(YEARS),tr=Math.random()<.5;const y=tr?e[2]:e[2]+pick(tight?[-2,-1,1,2]:[-11,-7,-4,-3,3,4,7,10]);

function genProc(level){

  if(level===3)return pick([gChem,()=>gYear(true)])();
  return pick([gChem,()=>gYear(true),()=>gYear(true)])();
}

let AC=null,musicG,sfxG,noiseBuf,vol={music:.55,sfx:.8};
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  const comp=AC.createDynamicsCompressor();comp.connect(master);
  musicG=AC.createGain();sfxG=AC.createGain();{const mf=AC.createBiquadFilter();mf.type='lowpass';mf.frequency.value=3400;musicG.connect(mf);mf.connect(comp);}sfxG.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setVols();startSeq();
}
function setVols(){if(!AC)return;musicG.gain.value=vol.music*.5;sfxG.gain.value=vol.sfx;}
function tone(f,d,o={}){
  if(!AC)return;const {type='sine',v=.2,at=0,to=null,dest=sfxG,atk=.005}=o;
  const s=AC.currentTime+Math.max(0,at),osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,s);if(to)osc.frequency.exponentialRampToValueAtTime(to,s+d);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+atk);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  osc.connect(g);g.connect(dest);osc.start(s);osc.stop(s+d+.05);
}
function noise(d,o={}){
  if(!AC)return;const {v=.3,at=0,type='bandpass',f=1000,q=1,to=null,dest=sfxG,atk=.003}=o;
  const s=AC.currentTime+Math.max(0,at),src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;src.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,s);fl.Q.value=q;
  if(to)fl.frequency.exponentialRampToValueAtTime(to,s+d);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+atk);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  src.connect(fl);fl.connect(g);g.connect(dest);src.start(s,Math.random());src.stop(s+d+.05);
}

function startSeq(){nextT=AC.currentTime+.1;setInterval(()=>{if(!AC)return;while(nextT<AC.currentTime+.15){schedStep(seqStep,nextT);seqStep=(seqStep+1)%64;nextT+=musicMode==='tense'?.115:musicMode==='calm'?.16:.134;}},25);}
function schedStep(st,time){
  if(musicMode==='off')return;
  const bar=Math.floor(st/16)%4,s=st%16,mt={dest:musicG,at:time-AC.currentTime};
  if(musicMode==='theme'){const ch=PROG[bar];
    if(s===0){ch.forEach(f=>tone(f,2,{...mt,type:'triangle',v:.035,atk:.08}));}
    if(s%4===0)tone(ch[0]/4,.34,{...mt,type:'triangle',v:.2});
    if(s===10||s===14)tone(ch[2]/4,.2,{...mt,type:'triangle',v:.12});
    if(s%2===0){const f=ch[MEL[(s/2)%8]]*2;tone(f,.3,{...mt,v:.05});tone(f*2,.14,{...mt,type:'triangle',v:.01});}
    if(s===0||s===8)tone(58,.2,{...mt,v:.32,to:42});
    if(s===4||s===12)noise(.11,{...mt,f:1700,q:.8,v:.045});
    if(s%2===1)noise(.025,{...mt,type:'highpass',f:8500,v:.022});
  }else if(musicMode==='calm'){const ch=PROG[bar];
    if(s===0){ch.forEach(f=>tone(f,2.6,{...mt,v:.035,atk:.5}));tone(ch[0]/4,2.4,{...mt,type:'triangle',v:.12,atk:.25});}
    if(s%4===0)tone(ch[(s/4)%3]*2,.7,{...mt,v:.028});
  }else if(musicMode==='tense'){const ch=PROGM[bar];
    if(s%2===0)tone(ch[0]/4,.15,{...mt,type:'triangle',v:.16});
    if(s===0)ch.forEach(f=>tone(f,1.9,{...mt,v:.03,atk:.35}));
    if(s%4===2)tone(ch[2]*2,.1,{...mt,v:.03});
    if(s===0||s===8)tone(52,.22,{...mt,v:.28,to:38});
  }
}

function Hs(x1,x2,cy){return `${x1+1},${cy} ${x1+5},${cy-4} ${x2-5},${cy-4} ${x2-1},${cy} ${x2-5},${cy+4} ${x1+5},${cy+4}`;}
function Vs(cx,y1,y2){return `${cx},${y1+1} ${cx+4},${y1+5} ${cx+4},${y2-5} ${cx},${y2-1} ${cx-4},${y2-5} ${cx-4},${y1+5}`;}
const SEG={a:Hs(6,34,5),b:Vs(35,6,34),c:Vs(35,36,64),d:Hs(6,34,65),e:Vs(5,36,64),f:Vs(5,6,34),g:Hs(6,34,35)};
const DIG={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcdfg','-':'g'};
function seg7(el,str,low){
  el.innerHTML=[...String(str)].map(ch=>`<svg viewBox="0 0 42 70" class="dg"><g transform="translate(4 0) skewX(-6)">${Object.entries(SEG).map(([k,p])=>`<polygon points="${p}" class="${(DIG[ch]||'').includes(k)?'on':'off'}"/>`).join('')}</g></svg>`).join('');
  el.classList.toggle('low',!!low);
}

/* ================= NET =================
   same browser  : BroadcastChannel (instant, works everywhere incl. offline)
   cross browser : PeerJS / WebRTC data channels via the public PeerJS broker
   every message carries a unique id so a tab that hears it on both paths handles it once */
const TAB=Math.random().toString(36).slice(2,9);
let chan=null,hostPin=null,players=[],probe=null,peer=null,conns=[],pconn=null,msgSeq=0,onMsgCur=null,netState='off';
const seen=new Set();
const NET_OK=typeof window.Peer==='function'&&typeof window.RTCPeerConnection==='function';
const PEER_ID=pin=>'jingruemua-show-v1-'+pin;
const PEER_OPTS={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
function deliver(m){if(!m||!onMsgCur)return;if(m.mid){if(seen.has(m.mid))return;seen.add(m.mid);if(seen.size>4000)seen.clear();}onMsgCur(m);}
function setNet(st){netState=st;const el=$('#netState');if(el){el.dataset.s=st;el.textContent=t('net_'+st);}}
function openChan(pin,onMsg,opt={}){
  closeChan();onMsgCur=onMsg;const name='jrm-room-'+pin;
  if('BroadcastChannel' in window){try{const bc=new BroadcastChannel(name);bc.onmessage=e=>deliver(e.data);chan=bc;}catch(e){}}
  if(!chan){const h=e=>{if(e.key===name&&e.newValue){try{deliver(JSON.parse(e.newValue).m);}catch(_){}}};addEventListener('storage',h);
    chan={postMessage(m){try{localStorage.setItem(name,JSON.stringify({m,n:Math.random()}));}catch(e){}},close(){removeEventListener('storage',h);}};}
  if(!NET_OK){setNet('local');return;}
  try{
    if(opt.host){setNet('connecting');
      peer=new Peer(PEER_ID(pin),PEER_OPTS);
      peer.on('open',()=>setNet('online'));
      peer.on('connection',c=>{conns.push(c);
        c.on('data',d=>{if(d&&d.from)c._tab=d.from;deliver(d);});
        c.on('close',()=>{conns=conns.filter(x=>x!==c);if(c._tab&&onMsgCur)onMsgCur({t:'leave',from:c._tab});});
        c.on('error',()=>{});});
      peer.on('disconnected',()=>{try{peer.reconnect();}catch(_){}});
      peer.on('error',e=>{if(e&&e.type==='unavailable-id'&&opt.onTaken){opt.onTaken();return;}if(netState!=='online')setNet('local');});
    }else{
      peer=new Peer(undefined,PEER_OPTS);
      peer.on('open',()=>{pconn=peer.connect(PEER_ID(pin),{reliable:true});
        pconn.on('open',()=>send({t:'ping'}));
        pconn.on('data',deliver);
        pconn.on('close',()=>{if(!isHost&&G&&onMsgCur)onMsgCur({t:'closed'});});
        pconn.on('error',()=>{});});
      peer.on('error',()=>{});
    }
  }catch(e){setNet('local');}
}
function closeChan(){if(chan){try{chan.close();}catch(e){}chan=null;}
  if(peer){try{peer.destroy();}catch(e){}}peer=null;conns=[];pconn=null;onMsgCur=null;}
function send(m){m.from=TAB;if(!m.mid)m.mid=TAB+'-'+(++msgSeq);
  try{chan&&chan.postMessage(m);}catch(e){}
  if(isHost)conns.forEach(c=>{try{if(c.open)c.send(m);}catch(e){}});
  else if(pconn&&pconn.open){try{pconn.send(m);}catch(e){}}}
function hostMsg(m){
  if(!m||m.from===TAB)return;
  if(m.t==='ping'){send({t:'pong',to:m.from});return;}
  if(m.t==='join'){if(!players.some(p=>p.id===m.from)){players.push({id:m.from,n:players.length+1,g:m.g||'m'});sfx('correct');toast(t('tJoin'));}
    renderLobby();refreshUI();if(G)send({t:'sync',to:m.from,snap:snapshot()});return;}
  if(m.t==='leave'){players=players.filter(p=>p.id!==m.from);renderLobby();refreshUI();return;}
  if(m.t==='in'&&G){if(m.a==='choose')H.choose(m.v);else if(m.a==='lock')H.lock(false);else if(m.a==='ll')H.ll(m.v);}
}
function playerMsg(m){
  if(!m||m.from===TAB)return;if(m.to&&m.to!==TAB)return;
  if(m.t==='pong'&&probe){probe.ok=true;return;}
  if(m.t==='ev'){if(m.ev.n==='start'){view='player';}apply(m.ev);return;}
  if(m.t==='sync'){applySync(m.snap);return;}

  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"'&&cell.trim()==='')q=true;else if(c===D){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}return rowsToQs(rows);}
let xlsxP=null;function loadXLSX(){return xlsxP||(xlsxP=new Promise((res,rej)=>{if(window.XLSX){res(window.XLSX);return;}const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res(window.XLSX);sc.onerror=()=>{xlsxP=null;rej(new Error('xlsx'));};document.head.appendChild(sc);}));}
async function parseFile(file){const n=file.name||'',ext=(n.split('.').pop()||'').toLowerCase();
  if(ext==='xlsx'||ext==='xls'){const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];return rowsToQs(X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}));}
  const txt=await file.text();
  if(ext==='json'||/^\s*[\[{]/.test(txt))return parseJSON(txt);
  return parseDelim(txt);}
function distribute(qs){const tiers=TIERS.map(()=>[]);const loose=[];
  qs.forEach(q=>{const {tier,...rest}=q;rest._e=true;if(tier!=null)tiers[tier].push(rest);else loose.push(rest);});
  loose.forEach(q=>{let i=TIERS.findIndex((T,k)=>tiers[k].length<T.n);if(i<0){i=tiers.reduce((b,a,k)=>a.length/TIERS[k].n<tiers[b].length/TIERS[b].n?k:b,0);}tiers[i].push(q);});
  return tiers;}
async function importFile(file,dest){if(!file)return;
  if(/^image\//.test(file.type)){toast(t('impNotQ'));return;}
  const busy=$('#'+(dest==='lib'?'libList':'qList'));busy.classList.add('scan');sfx('glitch');
  try{const r=await parseFile(file);if(!r.qs.length)throw new Error('empty');
    const tiers=distribute(r.qs);const name=(r.name||file.name.replace(/\.[^.]+$/,'')||t('untitled')).slice(0,60);
    const set=await storeSet(tiers,name,null);
    ed=tiers;edSetId=set.id;edSetName=set.name;edDirty=false;edTier=0;saveDraft();
    busy.classList.remove('scan');sfx('gold');
    toast(t('impOk',{n:r.qs.length,s:set.name})+(r.skip?' · '+t('impSkip',{n:r.skip}):''));
    if(dest==='lib'){libFocus=set.id;renderLib();}else{renderEditor(true);const s2=$('.iobar .setname');s2.classList.remove('flash');void s2.offsetWidth;s2.classList.add('flash');}
  }catch(e){busy.classList.remove('scan');sfx('wrong');toast(e&&e.message==='xlsx'?t('impXlsx'):t('impErr'));}}
$('#impFile').addEventListener('change',e=>{importFile(e.target.files[0],'ed');e.target.value='';});
$('#libFile').addEventListener('change',e=>{importFile(e.target.files[0],'lib');e.target.value='';});
function dropArea(box,zone,dest){let depth=0;const isFile=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
  box.addEventListener('dragenter',e=>{if(!isFile(e)||e.target.closest('.qimg'))return;depth++;zone.classList.add('on');});
  box.addEventListener('dragleave',e=>{if(!isFile(e))return;depth=Math.max(0,depth-1);if(!depth)zone.classList.remove('on');});
  box.addEventListener('dragover',e=>{if(isFile(e)&&!e.target.closest('.qimg'))e.preventDefault();});
  box.addEventListener('drop',e=>{depth=0;zone.classList.remove('on');if(e.target.closest('.qimg')||!isFile(e))return;e.preventDefault();importFile(e.dataTransfer.files[0],dest);});}
dropArea($('#mCreate .editor'),$('#dropZone'),'ed');dropArea($('#mLib .libbox'),$('#libDrop'),'lib');

(()=>{let u=null;try{u=new URLSearchParams(location.search).get('q');}catch(e){}if(!u)return;
  setTimeout(()=>fetch(u).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>{const f=new File([b],decodeURIComponent(u.split('/').pop().split('?')[0])||'questions.json',{type:b.type});return importFile(f,'ed').then(()=>{renderEditor(true);openModal('#mCreate');});}).catch(()=>toast(t('impErr'))),1200);})();
