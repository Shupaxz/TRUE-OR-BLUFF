<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จริงหรือมั่ว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,500;0,700;0,800;1,800&family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
:root{
  color-scheme:dark;
  --navy0:#030824;--navy1:#071652;--navy2:#0d2a8a;--blue:#1b4fd8;--cyan:#5fe3ff;
  --gold:#f5c542;--goldhi:#fff4b8;--goldlo:#a86b0c;
  --green:#1fbf45;--greenhi:#8dff6e;--red:#df1f2e;--redhi:#ff6a52;
  --text:#ffffff;--muted:#a9b9ee;
  --goldgrad:linear-gradient(180deg,#fff4b8 0%,#f5c542 42%,#b9800f 55%,#ffe27a 100%);
  --diam:linear-gradient(45deg,rgba(120,170,255,.06) 25%,transparent 25%,transparent 75%,rgba(120,170,255,.06) 75%),linear-gradient(-45deg,rgba(120,170,255,.06) 25%,transparent 25%,transparent 75%,rgba(120,170,255,.06) 75%);
  --disp:'Kanit','IBM Plex Sans Thai',system-ui,sans-serif;
  --ui:'IBM Plex Sans Thai','Kanit',system-ui,sans-serif;
  --num:'Chakra Petch','Kanit',system-ui,sans-serif;
  --ch:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--navy0);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button:disabled{cursor:not-allowed}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#monitor #stage{position:absolute}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(1,3,16,.85) 100%)}
body[data-view="host"] .vignette{display:none}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:35}
#flash.red{animation:flashR 1s ease-out}
#flash.gold{animation:flashG 1.4s ease-out}
#flash.cyan{animation:flashC .45s ease-out}
#flash.green{animation:flashV .8s ease-out}
@keyframes flashR{0%{opacity:1;background:radial-gradient(circle at 50% 60%,rgba(255,40,60,.7),rgba(120,0,20,.55))}100%{opacity:0}}
@keyframes flashG{0%{opacity:1;background:radial-gradient(circle at 50% 55%,rgba(255,230,150,.9),rgba(255,170,40,.35) 45%,transparent 75%)}100%{opacity:0}}
@keyframes flashC{0%{opacity:.8;background:linear-gradient(90deg,transparent,rgba(95,227,255,.55),transparent)}100%{opacity:0}}
@keyframes flashV{0%{opacity:.8;background:radial-gradient(circle at 50% 70%,rgba(141,255,110,.55),transparent 70%)}100%{opacity:0}}
#crack{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:34;opacity:0}
#crack.show{animation:crackF 2.4s ease-out forwards}
#crack path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw .35s ease-out forwards}
#crack .c1{stroke:#fff;stroke-width:2.2}
#crack .c2{stroke:#9ff6ff;stroke-width:7;opacity:.25}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes crackF{0%,60%{opacity:1}100%{opacity:0}}
#wipe{position:fixed;inset:-20% -60%;pointer-events:none;z-index:45;transform:translateX(-120%) skewX(-18deg);background:linear-gradient(90deg,transparent 0,var(--gold) 6%,var(--navy2) 7%,var(--navy1) 40%,var(--navy2) 60%,var(--gold) 61%,#fff4b8 62%,transparent 70%)}
#wipe.go{animation:wipe 1.1s cubic-bezier(.7,0,.3,1)}
@keyframes wipe{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(120%) skewX(-18deg)}}

/* ---------- shared gold frames ---------- */
.gframe{position:relative;background:var(--goldgrad);clip-path:var(--ch);padding:3px}
.gframe > .in{clip-path:var(--ch);background:var(--diam),linear-gradient(180deg,#0f2f9c,#06124a 70%);background-size:34px 34px,auto;height:100%;box-sizing:border-box}

/* ---------- MENU ---------- */
.menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,5vh,44px);padding-inline:16px;text-align:center}
.menu::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 45%,rgba(3,8,36,.72),transparent 80%);pointer-events:none}
.menu > *{position:relative}
.eyebrow{font-family:var(--num);letter-spacing:.34em;font-size:12px;color:var(--gold);text-transform:uppercase}
.logo{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.4vw,14px);margin:14px 0 6px;flex-wrap:nowrap}
.plate{background:var(--goldgrad);padding:4px;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%,0 18px);animation:plateIn .9s cubic-bezier(.2,1.3,.3,1) both;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.plate span{display:block;font-family:var(--disp);font-weight:800;line-height:1.05;padding:.12em .5em .08em;clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 15px,100% 100%,0 100%,0 15px);text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(255,255,255,.25)}
.plate.t span{background:linear-gradient(180deg,#7dff6a,#1fbf45 45%,#0c7a2a);font-size:clamp(46px,10vw,112px)}
.plate.f span{background:linear-gradient(180deg,#ff7a5c,#df1f2e 45%,#8a0c16);font-size:clamp(46px,10vw,112px)}
.plate.or{align-self:center;animation-delay:.12s}
.plate.or span{background:linear-gradient(180deg,#0f2f9c,#050f3e);font-size:clamp(18px,3vw,34px);padding:.2em .5em}
.plate.f{animation-delay:.22s}
@keyframes plateIn{0%{opacity:0;transform:translateY(-60px) scale(.6) rotate(-6deg)}100%{opacity:1;transform:none}}
.logo .plate.t span,.logo .plate.f span{position:relative;overflow:hidden}
.logo .plate span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);transform:translateX(-120%);animation:sheen 3.8s 1.2s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.tag{max-width:38ch;margin:10px auto 0;color:#d6e0ff;font-size:15px;line-height:1.6;text-shadow:0 2px 8px #000}
.menu-btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:min(780px,100%)}
.mbtn{flex:1 1 210px;max-width:250px;animation:rise .7s both}
.mbtn:nth-child(2){animation-delay:.08s}.mbtn:nth-child(3){animation-delay:.16s}
.mbtn .in{display:flex;align-items:center;gap:14px;padding:16px 18px;text-align:left;transition:background .2s}
.mbtn:hover{filter:brightness(1.15) drop-shadow(0 0 16px rgba(245,197,66,.45))}
.mbtn:hover .in{background:var(--diam),linear-gradient(180deg,#1a44c8,#081a66 70%);background-size:34px 34px,auto}
.mbtn svg{width:46px;height:46px;flex:none}
.mbtn b{display:block;font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.04em}
.mbtn small{display:block;color:var(--muted);font-size:13px}
.mbtn.play .in{background:var(--diam),linear-gradient(180deg,#1b8f3c,#07361a 75%);background-size:34px 34px,auto}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

/* ---------- MODALS ---------- */
.modal{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;background:rgba(2,5,24,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50}
.sheet{width:min(560px,100%);animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
.sheet.wide{width:min(780px,100%)}
.sheet > .in{padding:22px 24px;max-height:86vh;overflow:auto}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 4px;font-family:var(--disp);font-weight:800;font-size:26px;color:var(--gold);text-wrap:balance}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.55}
.pin-in{display:flex;gap:10px;justify-content:center;margin:14px 0 8px}
.pin-in input{width:60px;height:74px;text-align:center;font-family:var(--num);font-weight:700;font-size:38px;color:var(--gold);background:#020616;border:2px solid var(--goldlo);border-radius:6px}
.pin-in input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,197,66,.25);outline:none}
.err{min-height:20px;color:var(--redhi);font-size:13px;text-align:center}
.hint{font-size:13px;color:var(--muted);text-align:center;line-height:1.55}
.hint b{font-family:var(--num);color:var(--gold);letter-spacing:.2em}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.btn{font-family:var(--disp);font-weight:700;font-size:16px;padding:10px 18px;clip-path:var(--ch);background:#0b1f6e;box-shadow:inset 0 0 0 2px rgba(245,197,66,.45);transition:filter .2s,opacity .2s}
.btn:hover:not(:disabled){filter:brightness(1.25)}
.btn.pri{background:var(--goldgrad);color:#2a1800;box-shadow:none}
.btn.grn{background:linear-gradient(180deg,#5de86a,#1fbf45 50%,#0d7a2b);box-shadow:none}
.btn:disabled{opacity:.35}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-family:var(--disp);padding:7px 12px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(245,197,66,.3);color:var(--muted);font-size:14px}
.tab[aria-selected="true"]{background:rgba(245,197,66,.16);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.tab small{opacity:.7;margin-left:4px}
.tinfo{font-size:13px;color:var(--muted);margin:0 0 10px}
.tinfo.warn{color:var(--gold)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:start;padding:10px;background:rgba(0,0,0,.3);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(120,170,255,.2)}
.qrow textarea{width:100%;box-sizing:border-box;min-height:54px;resize:vertical;background:transparent;border:0;color:var(--text);font:inherit;font-size:14px;line-height:1.5}
.tf{display:flex;flex-direction:column;gap:4px}
.tf button{font-family:var(--disp);font-size:13px;padding:4px 12px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);color:var(--muted)}
.tf button.on.t{background:var(--green);color:#fff;box-shadow:none}
.tf button.on.f{background:var(--red);color:#fff;box-shadow:none}
.del{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.del:hover{color:var(--redhi);background:rgba(223,31,46,.15)}
.addq{margin-top:10px;width:100%;padding:12px;border-radius:6px;border:1px dashed var(--gold);color:var(--gold);font-family:var(--disp)}
.bigpin{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.bigpin span{width:64px;height:84px;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:46px;color:var(--gold);background:#020616;box-shadow:inset 0 0 0 2px var(--gold),0 0 26px rgba(245,197,66,.3);border-radius:6px;animation:flip .6s both}
.bigpin span:nth-child(2){animation-delay:.08s}.bigpin span:nth-child(3){animation-delay:.16s}.bigpin span:nth-child(4){animation-delay:.24s}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.plist{display:flex;flex-direction:column;gap:6px;min-height:40px;padding:10px;border-radius:6px;background:rgba(0,0,0,.3);font-size:14px}
.plist .p{display:flex;align-items:center;gap:8px;animation:rise .4s both}
.plist .dot{width:8px;height:8px;border-radius:50%;background:var(--greenhi);box-shadow:0 0 8px var(--greenhi)}
.plist .empty{color:var(--muted)}
.plist .empty i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:8px;animation:blink 1s infinite}
.steps-help{margin:14px 0 0;padding:10px 12px;border-radius:6px;background:rgba(95,227,255,.07);box-shadow:inset 0 0 0 1px rgba(95,227,255,.25);font-size:13px;line-height:1.6;color:#d6e6ff}
.steps-help ol{margin:4px 0 0;padding-left:20px}
.set{display:grid;gap:16px}
.set label{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:12px;font-size:14px}
.set output{font-family:var(--num);text-align:right;color:var(--gold)}
input[type=range]{accent-color:var(--gold);width:100%}
.seg{display:inline-flex;box-shadow:inset 0 0 0 1px rgba(245,197,66,.4);border-radius:5px;overflow:hidden}
.seg button{padding:8px 16px;font-family:var(--disp);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--goldgrad);color:#2a1800}
.lrow{display:flex;align-items:center;gap:12px;font-size:14px}
.lrow > span{width:120px}

/* ---------- WAIT (remote player) ---------- */
.wait{position:fixed;inset:0;display:grid;place-items:center;padding-inline:16px;text-align:center;z-index:30;background:radial-gradient(60% 50% at 50% 50%,rgba(3,8,36,.6),transparent)}
.wait h2{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5vw,44px);margin:10px 0 6px;color:var(--gold)}
.wait p{color:var(--muted);margin:0}
.wait .dots i{display:inline-block;width:10px;height:10px;margin:18px 5px 0;border-radius:50%;background:var(--gold);animation:bounce 1s infinite}
.wait .dots i:nth-child(2){animation-delay:.15s}.wait .dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{50%{transform:translateY(-10px);opacity:.4}}

/* ---------- PLAYER VIEW ---------- */
.pv{position:fixed;inset:0;pointer-events:none}
.pv > *{pointer-events:auto}
.pv-top{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:flex-start;gap:10px;pointer-events:none}
.pv-top > *{pointer-events:auto}
.grow{flex:1}
.info .in{display:flex;align-items:center;gap:12px;padding:7px 14px;font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap}
.info .tchip{color:var(--gold)}
.info .tchip.fin{color:#ff8a6a}
.info .stake{font-family:var(--num);color:#fff;background:rgba(245,197,66,.14);padding:2px 8px;border-radius:3px}
.info .sep{width:1px;height:16px;background:rgba(245,197,66,.4)}
.ibtn{width:44px;height:44px}
.ibtn .in{display:grid;place-items:center}
.ibtn svg{width:22px;height:22px;color:var(--gold)}
.vsw .in{display:flex;align-items:center;gap:8px;padding:9px 14px;font-family:var(--disp);font-weight:700;font-size:14px;color:var(--gold);white-space:nowrap}
.vsw svg{width:18px;height:18px}

/* staircase prize ladder */
.stairs{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 232px);width:290px;display:flex;flex-direction:column;gap:5px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.st{position:relative;margin-left:calc(var(--i) * 20px);height:38px;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:0 12px 0 10px;background:var(--diam),linear-gradient(180deg,#123aae,#061552 80%);background-size:24px 24px,auto;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%,0 12px);font-family:var(--disp);transition:filter .4s}
.st::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--goldgrad)}
.st::after{content:"";position:absolute;left:0;top:10px;bottom:0;width:3px;background:var(--goldgrad)}
.st .sn{width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#2a1800;background:var(--goldgrad);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.st .sp{display:flex;gap:3px}
.st .sp i{width:8px;height:12px;transform:skewX(-14deg);background:rgba(95,227,255,.14);box-shadow:inset 0 0 0 1px rgba(95,227,255,.5)}
.st .sp i.on{background:var(--greenhi);box-shadow:0 0 8px var(--greenhi)}
.st .sz{display:flex;align-items:center;gap:6px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.st .sz svg{width:16px;height:16px}
.st .sk{display:none}
.st.safe .sn{background:linear-gradient(180deg,#bff6ff,#5fe3ff 50%,#1a8fb3);color:#032}
.st.fin .sz{color:var(--gold)}
.st.fin{background:var(--diam),linear-gradient(180deg,#6a0f22,#2a0512 80%);background-size:24px 24px,auto}
.st.done{background:var(--diam),linear-gradient(180deg,#1a8f3a,#063018 80%);background-size:24px 24px,auto}
.st.done .sn{background:linear-gradient(180deg,#d6ffd0,#8dff6e 50%,#1fbf45)}
.st.cur{background:var(--goldgrad);color:#2a1800;filter:drop-shadow(0 0 14px rgba(245,197,66,.7));animation:curStep 1.6s ease-in-out infinite}
.st.cur .sn{background:#07123f;color:var(--gold)}
.st.cur .sp i{background:rgba(42,24,0,.2);box-shadow:inset 0 0 0 1px rgba(42,24,0,.5)}
.st.cur .sp i.on{background:#0c7a2a;box-shadow:none}
.st.cur::before,.st.cur::after{background:#fff}
.st.cur .shine{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 2.2s ease-in-out infinite}
@keyframes curStep{50%{transform:translateX(-4px)}}
.st .mk{position:absolute;left:-26px;top:50%;width:18px;height:18px;transform:translateY(-50%)}
.st.lost{filter:grayscale(1) brightness(.5)}

/* question band */
.band{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;align-items:center}
#status{font-size:13px;color:#d6e0ff;min-height:18px;margin-bottom:6px;padding-inline:16px;text-align:center;text-shadow:0 2px 6px #000}
.tabs3{display:flex;align-items:flex-end;gap:8px;position:relative;z-index:2;margin-bottom:-4px}
.atab{position:relative;width:clamp(120px,15vw,178px);height:clamp(50px,6vw,62px);background:var(--goldgrad);padding:4px 4px 0;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%,0 16px);transition:transform .2s cubic-bezier(.2,1.4,.3,1),filter .25s,opacity .25s}
.atab > span{display:grid;place-items:center;height:100%;font-family:var(--disp);font-weight:800;font-size:clamp(24px,3vw,34px);clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%,0 13px);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.atab.t > span{background:linear-gradient(180deg,#7dff6a,#1fbf45 50%,#0c7a2a)}
.atab.f > span{background:linear-gradient(180deg,#ff7a5c,#df1f2e 50%,#8a0c16)}
.atab:not(:disabled):hover{transform:translateY(-4px)}
.atab.sel{transform:translateY(-10px) scale(1.06);filter:drop-shadow(0 0 18px rgba(255,255,255,.55))}
.atab.t.sel{filter:drop-shadow(0 0 22px rgba(141,255,110,.9))}
.atab.f.sel{filter:drop-shadow(0 0 22px rgba(255,106,82,.9))}
.atab.dim{opacity:.45;filter:saturate(.4)}
.atab.sel > span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);animation:sheen 1.4s ease-in-out infinite}
.atab:disabled{cursor:default}
.orlock{width:96px;height:44px;background:var(--goldgrad);padding:3px 3px 0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%,0 10px);transition:transform .2s}
.orlock > span{display:flex;align-items:center;justify-content:center;gap:6px;height:100%;background:linear-gradient(180deg,#0f2f9c,#050f3e);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%,0 8px);font-family:var(--disp);font-weight:700;font-size:18px}
.orlock .lk{display:none}
.orlock svg{width:18px;height:18px}
.orlock.can .or{display:none}.orlock.can .lk{display:flex}

.bar.sweep::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);animation:barSweep .9s ease-out forwards;pointer-events:none}

.lls{display:flex;gap:12px}
.llm{position:relative;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .25s cubic-bezier(.2,1.4,.3,1),opacity .3s,filter .3s}

.llm.ready .disc{animation:ready 1.8s ease-in-out infinite}

.llm:disabled{opacity:.55}
.llm.used{opacity:.35;filter:grayscale(1)}
.llm.used .disc::after{content:"";position:absolute;width:74px;height:4px;background:var(--red);transform:rotate(-40deg);box-shadow:0 0 8px var(--red)}
.llm.banned .disc::before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:repeating-linear-gradient(-45deg,rgba(223,31,46,.5) 0 5px,transparent 5px 10px)}
.llm.fire .disc{animation:fire .8s cubic-bezier(.2,1.4,.3,1)}
@keyframes fire{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(25deg);box-shadow:0 0 0 3px #fff,0 0 50px #fff4b8}100%{transform:scale(1)}}
.qbox{position:relative;overflow:hidden;min-width:0;display:flex;align-items:center;justify-content:center;min-height:84px}
#qText{margin:0;text-align:center;font-family:var(--disp);font-weight:700;font-size:clamp(20px,2.7vw,36px);line-height:1.32;text-wrap:balance;text-shadow:0 3px 0 #020a3a,0 0 18px rgba(95,160,255,.5)}
#qText.dim{font-weight:500;color:#c9d6ff;font-size:clamp(16px,1.9vw,22px)}
#qText .w{display:inline-block;white-space:nowrap}
#qText .c{display:inline-block;white-space:pre;animation:chIn .55s cubic-bezier(.2,1.4,.3,1) both}
@keyframes chIn{0%{opacity:0;transform:translateY(-.9em) rotateX(90deg) scale(1.6);filter:blur(6px);color:#f5c542}55%{opacity:1;color:#fff4b8;text-shadow:0 0 22px #f5c542}100%{opacity:1;transform:none;filter:none}}

.qbox.glitch{animation:gshake .1s steps(2) infinite}

@keyframes gshake{0%{transform:translate(-3px,1px) skewX(4deg)}100%{transform:translate(3px,-1px) skewX(-4deg)}}
.tbox{position:relative;align-self:stretch}
.thouse{position:absolute;right:-16px;bottom:-16px;width:186px;height:168px;background:var(--goldgrad);clip-path:polygon(0 100%,0 74%,20% 74%,20% 54%,40% 54%,40% 34%,52% 34%,52% 0,100% 0,100% 100%);filter:drop-shadow(0 -6px 18px rgba(0,0,0,.5))}
.thouse::before{content:"";position:absolute;inset:4px 4px 8px 4px;background:var(--diam),linear-gradient(180deg,#123aae,#040c3a);background-size:30px 30px,auto;clip-path:polygon(0 100%,0 76%,20% 76%,20% 56%,40% 56%,40% 36%,53% 36%,53% 0,100% 0,100% 100%)}

.thouse .lbl{position:absolute;right:12px;top:112px;width:70px;text-align:center;font-family:var(--num);font-size:10px;letter-spacing:.2em;color:var(--gold)}
.thouse.low{animation:hot .5s steps(2) infinite}
@keyframes hot{50%{background:linear-gradient(180deg,#ffd0c0,#ff3b3b 50%,#8a0c16)}}
.seg7{display:flex;gap:4px;justify-content:center}
.seg7 .dg{width:48px;height:84px}
.seg7 polygon.on{fill:#fff6cf;filter:drop-shadow(0 0 4px #ffc94a) drop-shadow(0 0 10px rgba(255,180,40,.7))}
.seg7 polygon.off{fill:rgba(255,210,110,.07)}

.seg7.pop{animation:segPop .35s cubic-bezier(.2,1.6,.3,1)}

/* ---------- HOST VIEW ---------- */
.hv{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box;background:var(--diam),radial-gradient(90% 70% at 50% 0%,#0f2f9c,#030824 70%);background-size:40px 40px,auto;display:flex;flex-direction:column;gap:14px}
.hv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.minilogo{display:flex;gap:4px;align-items:flex-end}
.minilogo .plate span{font-size:20px!important;padding:.1em .45em}
.minilogo .plate{padding:2px;animation:none;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%,0 8px)}
.minilogo .plate span{clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%,0 7px)}

.hchip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:4px;background:rgba(2,6,30,.6);box-shadow:inset 0 0 0 1px rgba(245,197,66,.35);font-family:var(--disp);font-size:14px;white-space:nowrap}
.hchip b{font-family:var(--num);color:var(--gold);letter-spacing:.08em}
.hchip.air{background:var(--red);box-shadow:none;font-weight:700;letter-spacing:.1em}
.hchip.air i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.hv-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:16px;align-items:start}
.hv-left,.hv-right{display:flex;flex-direction:column;gap:14px;min-width:0}
.monitor{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;box-shadow:0 0 0 3px var(--gold),0 0 0 6px #5a3a06,0 14px 40px rgba(0,0,0,.6);border-radius:4px;overflow:hidden}
.mon-tag{position:absolute;left:10px;top:10px;z-index:2;font-family:var(--num);font-size:11px;letter-spacing:.18em;padding:4px 8px;background:rgba(0,0,0,.6);border-radius:3px;color:var(--gold)}
.mon-live{position:absolute;right:10px;top:10px;z-index:2;font-family:var(--num);font-size:11px;letter-spacing:.18em;padding:4px 8px;background:var(--red);border-radius:3px}
.mon-q{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:8px 12px;background:linear-gradient(0deg,rgba(3,8,36,.92),transparent);font-family:var(--disp);font-weight:700;font-size:clamp(13px,1.4vw,17px);text-align:center;text-shadow:0 2px 4px #000}
.card .in{padding:14px 16px}
.card h3{margin:0 0 10px;font-family:var(--disp);font-size:13px;letter-spacing:.14em;color:var(--gold);display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;font-family:var(--num);letter-spacing:.06em;color:var(--muted);font-size:12px}
#hvQ{margin:0 0 12px;font-family:var(--disp);font-weight:700;font-size:clamp(17px,1.8vw,22px);line-height:1.4}
#hvQ.dim{color:var(--muted);font-weight:500;font-size:15px}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kb{padding:8px 10px;border-radius:5px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(120,170,255,.2);min-height:58px;box-sizing:border-box}
.kb small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.kb b{font-family:var(--disp);font-weight:800;font-size:20px}
.kb b.t{color:var(--greenhi)}.kb b.f{color:var(--redhi)}
.llmini{display:flex;gap:4px}
.llmini svg{width:30px;height:30px;transition:opacity .3s,filter .3s}
.llmini svg.x{opacity:.25;filter:grayscale(1)}
.nextq{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5}
.nextq b{color:#d6e0ff;font-weight:500}
.console .in{padding:14px 14px 16px;display:flex;flex-direction:column;gap:14px}
.cg h4{margin:0 0 7px;font-family:var(--disp);font-size:13px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:8px}
.cg h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(245,197,66,.5),transparent)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb{position:relative;display:flex;align-items:center;gap:8px;padding:11px 10px 13px;border-radius:6px;font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.2;text-align:left;background:linear-gradient(180deg,#2451d6,#0f2a8c);box-shadow:0 4px 0 #061552,inset 0 1px 0 rgba(255,255,255,.3);transition:transform .08s,box-shadow .08s,filter .2s,opacity .2s}
.cb svg{width:20px;height:20px;flex:none}
.cb:hover:not(:disabled){filter:brightness(1.2)}
.cb:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #061552,inset 0 1px 0 rgba(255,255,255,.3)}
.cb:disabled{opacity:.32;filter:saturate(.3)}
.cb.full{grid-column:1/-1}
.cb.g{background:linear-gradient(180deg,#43d95c,#15962f);box-shadow:0 4px 0 #0a4d1a,inset 0 1px 0 rgba(255,255,255,.35)}
.cb.r{background:linear-gradient(180deg,#f04a4a,#b0131f);box-shadow:0 4px 0 #5a0810,inset 0 1px 0 rgba(255,255,255,.35)}
.cb.y{background:linear-gradient(180deg,#ffe27a,#d99a1a);color:#2a1800;box-shadow:0 4px 0 #6b4506,inset 0 1px 0 rgba(255,255,255,.5)}
.cb.o{background:linear-gradient(180deg,#ff9a4a,#c85a10);box-shadow:0 4px 0 #5a2806,inset 0 1px 0 rgba(255,255,255,.35)}
.cb[aria-pressed="true"]{background:linear-gradient(180deg,#8ff0ff,#1fa8cc);color:#02202a;box-shadow:0 4px 0 #0a4a5a,0 0 18px rgba(95,227,255,.6)}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px;border-radius:8px;background:radial-gradient(circle at 50% 30%,#2a5be0,#0a1d6e);box-shadow:0 4px 0 #04103e,inset 0 0 0 1px rgba(245,197,66,.4);font-family:var(--disp);font-size:13px;transition:transform .08s}
.pad svg{width:26px;height:26px}
.pad:active,.pad.hit{transform:translateY(3px);background:radial-gradient(circle,#ffe27a,#b9800f);color:#2a1800;box-shadow:0 1px 0 #04103e,0 0 20px rgba(245,197,66,.7)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--disp);font-size:15px;padding:4px 2px}
.toggle-row small{display:block;font-family:var(--ui);font-size:12px;color:var(--muted)}
.tog{width:50px;height:28px;flex:none;border-radius:14px;background:rgba(255,255,255,.15);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tog[aria-pressed="true"]{background:var(--green)}
.tog[aria-pressed="true"]::after{transform:translateX(22px)}
.stairs.mini{position:static;width:auto;flex-direction:row;align-items:flex-end;gap:4px;filter:none}
.stairs.mini .st{margin-left:0;flex:1;height:calc(28px + var(--i) * 10px);grid-template-columns:1fr;justify-items:center;align-content:space-between;padding:6px 2px 5px;gap:2px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.stairs.mini .st .sp,.stairs.mini .st .sz,.stairs.mini .st .mk{display:none}
.stairs.mini .st .sk{display:block;font-family:var(--num);font-size:12px;font-weight:700}
.stairs.mini .st .sn{width:22px;height:22px;font-size:13px}

/* ---------- banner / toast / end ---------- */
#banner{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:40;width:calc(100% - 32px);opacity:0}
#banner .rays{position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,244,184,.2) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:spin 8s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
#banner .bt{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(46px,10vw,118px);line-height:1;text-wrap:balance;-webkit-text-stroke:2px rgba(0,0,0,.25)}
#banner .bs{margin-top:10px;font-family:var(--disp);font-weight:700;font-size:clamp(16px,2.4vw,26px);text-shadow:0 2px 10px #000}
#banner.show{animation:bannerIn 2.3s cubic-bezier(.2,1,.3,1) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2) skewX(-14deg);filter:blur(12px)}12%{opacity:1;transform:translate(-50%,-50%) scale(.95) skewX(-6deg);filter:none}20%{transform:translate(-50%,-50%) scale(1.02) skewX(-6deg)}82%{opacity:1;transform:translate(-50%,-50%) scale(1.05) skewX(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15) skewX(-6deg)}}
#banner.good .bt{color:#b8ffa8;text-shadow:0 0 30px rgba(141,255,110,.8),0 5px 0 #0c5a22}
#banner.bad .bt{color:#ffb0a0;text-shadow:0 0 30px rgba(255,60,60,.9),0 5px 0 #5a0810}
#banner.gold .bt .c{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
#banner.gold .bt{filter:drop-shadow(0 0 22px rgba(245,197,66,.8)) drop-shadow(0 5px 0 #5a3a06)}
#banner.info .bt{color:#fff;text-shadow:0 0 30px rgba(95,227,255,.9),0 5px 0 #0a2a7a}
#banner.bad .rays{background:repeating-conic-gradient(rgba(255,60,60,.2) 0 6deg,transparent 6deg 18deg)}
#banner.good .rays{background:repeating-conic-gradient(rgba(141,255,110,.2) 0 6deg,transparent 6deg 18deg)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);font-family:var(--disp);font-weight:700;font-size:15px;padding:8px 16px;border-radius:4px;background:rgba(3,8,36,.9);box-shadow:inset 0 0 0 2px var(--gold);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:42;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.endcard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));z-index:38;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
.endcard .in{padding:20px;text-align:center}
.endcard .et{font-family:var(--disp);font-weight:800;font-size:28px;color:var(--gold)}
.endcard .ek{font-family:var(--num);font-size:12px;letter-spacing:.22em;color:var(--muted);margin-top:8px}
.endcard .em{font-family:var(--num);font-weight:700;font-size:52px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(245,197,66,.5))}
.endcard .es{font-size:14px;color:#d6e0ff;margin-top:2px}
.endcard .row{justify-content:center}
.spec{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);font-family:var(--disp);font-size:13px;padding:6px 12px;border-radius:4px;background:rgba(3,8,36,.75);box-shadow:inset 0 0 0 1px rgba(245,197,66,.4);color:var(--gold);display:flex;gap:8px;align-items:center;white-space:nowrap;z-index:5}
.spec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}

/* ---------- question intro card ---------- */
#qcard{position:fixed;left:50%;top:40%;z-index:36;pointer-events:none;transform:translate(-50%,-50%);opacity:0}
body[data-view="host"] #qcard{display:none}
#qcard .qc{position:relative;background:var(--goldgrad);padding:4px;clip-path:var(--ch)}
#qcard .in2{padding:14px clamp(26px,5vw,56px) 12px;clip-path:var(--ch);background:var(--diam),linear-gradient(180deg,#1a47c9,#050f3e);background-size:34px 34px,auto;text-align:center;white-space:nowrap}
#qcard small{display:block;font-family:var(--num);letter-spacing:.26em;color:var(--gold);font-size:13px}
#qcard b{display:block;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(40px,7.5vw,84px);line-height:1.08;text-shadow:0 5px 0 #020a3a,0 0 26px rgba(95,160,255,.7)}
#qcard em{display:block;font-style:normal;font-family:var(--disp);font-weight:700;font-size:clamp(16px,2.2vw,22px);color:#fff4b8}
#qcard.fin .in2{background:var(--diam),linear-gradient(180deg,#a8142e,#2a0512);background-size:34px 34px,auto}
#qcard .rays{position:absolute;left:50%;top:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;background:repeating-conic-gradient(rgba(255,244,184,.22) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 12%,transparent 62%);mask:radial-gradient(circle,#000 12%,transparent 62%);animation:spin 6s linear infinite;z-index:-1}
#qcard.show{animation:qcIn 1.3s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes qcIn{0%{opacity:0;transform:translate(-50%,-50%) perspective(700px) rotateX(85deg) scale(1.7)}16%{opacity:1;transform:translate(-50%,-50%) perspective(700px) rotateX(-8deg) scale(1)}24%{transform:translate(-50%,-50%) perspective(700px) rotateX(0) scale(1.04)}68%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,140%) scale(.35)}}
.qbox.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,244,184,.6) 48%,transparent 64%);mix-blend-mode:overlay;animation:barSweep 1s ease-out forwards;pointer-events:none}

/* ---------- choice slots ---------- */
.slot{position:relative;display:block}
.tabs3 .slot{opacity:0;transform:translateY(70px) scale(.5);transition:opacity .3s,transform .4s cubic-bezier(.5,0,.8,.4)}
.tabs3.shown .slot{opacity:1;transform:none;transition:none;animation:slotIn .75s cubic-bezier(.2,1.5,.35,1) both;animation-delay:var(--d,0s)}
.tabs3 .s1{--d:0s}.tabs3 .s3{--d:.14s}.tabs3 .s2{--d:.3s}
.tabs3.shown .s2{animation-name:orIn}
@keyframes slotIn{0%{opacity:0;transform:translateY(100px) scale(.3) rotate(-10deg)}55%{opacity:1;transform:translateY(-16px) scale(1.14) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes orIn{0%{opacity:0;transform:translateY(-70px) rotateY(540deg) scale(.3)}100%{opacity:1;transform:none}}
.tabs3.shown .slot::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;z-index:-1;opacity:0;animation:burstB .8s ease-out both;animation-delay:calc(var(--d,0s) + .12s)}
.tabs3 .s1::before{background:radial-gradient(circle,rgba(200,255,180,.95),rgba(61,255,106,.4) 28%,transparent 62%)}
.tabs3 .s3::before{background:radial-gradient(circle,rgba(255,210,200,.95),rgba(255,60,60,.4) 28%,transparent 62%)}
.tabs3 .s2::before{background:radial-gradient(circle,rgba(255,244,184,.9),rgba(245,197,66,.35) 28%,transparent 62%)}
@keyframes burstB{0%{opacity:0;transform:scale(.15)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.slot.pulse::after{content:"";position:absolute;inset:-4px -4px -2px;border:3px solid #fff4b8;border-radius:10px;pointer-events:none;animation:ring .65s ease-out forwards}
@keyframes ring{from{opacity:1;transform:scale(.92)}to{opacity:0;transform:scale(1.45)}}

/* ---------- banner letters ---------- */
#banner .bt .w{display:inline-block;white-space:nowrap}
#banner .bt .c{display:inline-block;white-space:pre;animation:bLetter .65s cubic-bezier(.2,1.6,.3,1) both}
@keyframes bLetter{0%{opacity:0;transform:translateY(-1.1em) scale(2.4) rotate(-24deg);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}

/* ---------- lifeline lock / unlock ---------- */
.llm .pl{position:absolute;left:50%;top:0;width:62px;height:62px;margin-left:-31px;border-radius:50%;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle,rgba(3,8,36,.35),rgba(3,8,36,.75) 70%),repeating-linear-gradient(45deg,rgba(245,197,66,.28) 0 4px,transparent 4px 11px)}
.llm .pl svg{width:34px;height:34px;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7))}
.llm .pl .sh,.llm .pl .bd{transform-box:fill-box;transform-origin:center}
.llm.locked .pl,.llm.unlocking .pl,.llm.locking .pl{opacity:1}
.llm.locked .disc{filter:grayscale(.85) brightness(.5)}
.llm.locked b{color:var(--muted)}
.llm.unlocking .pl{background:none;transition:none}
.llm.unlocking .pl .sh{animation:shOff .8s cubic-bezier(.3,1.4,.5,1) forwards}
.llm.unlocking .pl .bd{animation:bdOff .8s ease-in forwards}
@keyframes shOff{0%{transform:none}25%{transform:translateY(-6px) rotate(-10deg)}100%{transform:translate(-16px,-26px) rotate(-70deg);opacity:0}}
@keyframes bdOff{0%,20%{transform:none}100%{transform:translate(12px,36px) rotate(40deg);opacity:0}}
.llm.unlocking .disc{animation:spinOn 1.1s cubic-bezier(.2,1.2,.3,1)}
@keyframes spinOn{0%{transform:rotateY(0) scale(1);filter:grayscale(1) brightness(.5)}45%{transform:rotateY(540deg) scale(1.35);filter:brightness(2.2);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold),0 0 50px #fff4b8}100%{transform:rotateY(720deg) scale(1);filter:none}}
.llm.unlocking::after{content:"";position:absolute;left:50%;top:31px;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid #fff4b8;pointer-events:none;animation:ring .9s .25s ease-out both}
.llm.locking .pl .sh,.llm.locking .pl .bd{animation:lockDrop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes lockDrop{0%{transform:translateY(-70px) scale(1.6);opacity:0}60%{opacity:1}100%{transform:none}}
.llm.locking .disc{animation:thud .45s .35s both}
@keyframes thud{0%{transform:none}30%{transform:translateY(5px) scale(.92)}60%{transform:translateY(-2px)}100%{transform:none}}

/* lifeline cut-in */
#cutin{position:fixed;inset:0;pointer-events:none;z-index:44;display:grid;place-items:center;overflow:hidden;visibility:hidden;--c1:#1fbf45;--c2:#df1f2e}
#cutin[data-k="rr"]{--c1:#1fa8cc;--c2:#6a4bff}
#cutin[data-k="gd"]{--c1:#d99a1a;--c2:#ffe27a}
#cutin.go{visibility:visible;animation:ciHide 1.8s steps(1) forwards}
@keyframes ciHide{0%{visibility:visible}100%{visibility:hidden}}
.ci-band{position:absolute;left:-10%;right:-10%;top:50%;height:clamp(130px,24vh,210px);transform:translateY(-50%) skewY(-7deg) scaleX(0);background:repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 16px,transparent 16px 32px),linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 -6px 0 var(--gold),0 6px 0 var(--gold),0 0 80px var(--c1)}
#cutin.go .ci-band{animation:ciBand 1.8s cubic-bezier(.7,0,.2,1) forwards}
@keyframes ciBand{0%{transform:translateY(-50%) skewY(-7deg) scaleX(0);transform-origin:left}22%{transform:translateY(-50%) skewY(-7deg) scaleX(1);transform-origin:left}78%{transform:translateY(-50%) skewY(-7deg) scaleX(1);transform-origin:right}100%{transform:translateY(-50%) skewY(-7deg) scaleX(0);transform-origin:right}}
.ci-row{position:relative;display:flex;align-items:center;gap:clamp(14px,3vw,34px);padding-inline:16px;transform:skewY(-7deg)}
.ci-disc{flex:none;width:clamp(100px,16vw,170px);height:clamp(100px,16vw,170px);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1f4fd6,#061552 70%);box-shadow:0 0 0 6px var(--gold),0 0 0 11px #7a4f08,0 0 70px var(--c1);opacity:0}
.ci-disc svg{width:78%;height:78%}
#cutin.go .ci-disc{animation:ciDisc 1.8s cubic-bezier(.2,1.1,.3,1) forwards}
@keyframes ciDisc{0%{opacity:1;transform:translateX(-70vw) rotate(-720deg) scale(.4)}26%{transform:translateX(0) rotate(0) scale(1.18)}34%{transform:scale(1)}76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateX(70vw) rotate(360deg) scale(.5)}}
.ci-txt{opacity:0}
.ci-txt small{display:block;font-family:var(--num);letter-spacing:.34em;font-size:clamp(12px,1.6vw,18px);color:#fff}
.ci-txt b{display:block;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(36px,7.4vw,92px);line-height:1.05;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 30px var(--c1)}
.ci-txt .w{display:inline-block;white-space:nowrap}
.ci-txt .c{display:inline-block;white-space:pre;animation:ciLetter .5s cubic-bezier(.2,1.5,.3,1) both;animation-delay:inherit}
#cutin.go .ci-txt{animation:ciTxt 1.8s forwards}
#cutin.go .ci-txt .c{animation-name:ciLetter}
@keyframes ciTxt{0%,20%{opacity:0}26%,74%{opacity:1;transform:none}100%{opacity:0;transform:translateX(50vw)}}
@keyframes ciLetter{0%{opacity:0;transform:translateX(90px) skewX(-35deg) scale(1.4)}100%{opacity:1;transform:none}}

/* lifeline unlock / lock strip */
#llStrip{position:fixed;left:0;right:0;top:56%;z-index:43;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:14px;height:70px;padding-inline:16px;opacity:0;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(20px,3.6vw,38px);color:#2a1800;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 14px,transparent 14px 28px),var(--goldgrad);box-shadow:0 0 0 3px #fff4b8,0 0 50px rgba(245,197,66,.8);white-space:nowrap}
#llStrip.off{color:#fff;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.28) 0 14px,transparent 14px 28px),linear-gradient(180deg,#ff6a52,#df1f2e 50%,#8a0c16);box-shadow:0 0 0 3px #ffb0a0,0 0 50px rgba(255,60,60,.8)}
#llStrip svg{width:48px;height:48px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#llStrip.go{animation:strip 1.9s cubic-bezier(.7,0,.2,1) forwards}
#llStrip.go svg{animation:stripIcon 1.9s cubic-bezier(.2,1.4,.3,1) both}
@keyframes strip{0%{opacity:1;clip-path:inset(0 100% 0 0)}20%{clip-path:inset(0 0 0 0)}80%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:1;clip-path:inset(0 0 0 100%)}}
@keyframes stripIcon{0%{transform:scale(0) rotate(-180deg)}25%{transform:scale(1.3) rotate(10deg)}35%,100%{transform:none}}

/* MC lifeline toggles */
.llgrid{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.lltog{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;background:rgba(0,0,0,.3);box-shadow:inset 0 0 0 1px rgba(245,197,66,.22);transition:background .3s,box-shadow .3s}
.lltog > svg{width:34px;height:34px;transition:filter .3s}
.lltog b{display:block;font-family:var(--disp);font-size:15px}
.lltog small{display:block;font-size:12px;color:var(--muted)}
.lltog:not(.on) > svg{filter:grayscale(.8) brightness(.6)}
.lltog.on{background:rgba(245,197,66,.13);box-shadow:inset 0 0 0 1px var(--gold),0 0 18px rgba(245,197,66,.2)}
.lltog.on small{color:var(--greenhi)}
.lltog.used{opacity:.5}.lltog.used small{color:var(--redhi)}
.lltog.flip{animation:tflip .7s}
@keyframes tflip{40%{transform:scale(1.04);box-shadow:inset 0 0 0 2px #fff,0 0 34px rgba(245,197,66,.7)}}
.tog:disabled{opacity:.3;cursor:not-allowed}

/* editor auto-generate */
.genbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn.gen{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#8b6bff,#1fa8cc);box-shadow:none}
.btn.gen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3s ease-in-out infinite}
.btn.gen.busy::after{animation:barSweep .6s linear infinite}
.qlist.scan{position:relative;filter:blur(1.5px) brightness(.6);transition:filter .3s}
.qrow.gen{animation:rowIn .5s cubic-bezier(.2,1.3,.3,1) both}
@keyframes rowIn{from{opacity:0;transform:translateX(-36px) scale(.95);box-shadow:inset 0 0 0 2px var(--gold)}to{opacity:1;transform:none}}

/* ---------- band: lifelines + tabs row ---------- */
.toprow{width:100%;box-sizing:border-box;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding-inline:16px;position:relative;z-index:2;margin-bottom:-4px}
.toprow .lls{justify-self:start;padding-bottom:10px}
.toprow .tabs3{margin-bottom:0}
.bar{grid-template-columns:200px minmax(0,1fr) 170px}
/* tier box */
.tierbox{position:relative;align-self:center;background:var(--goldgrad);padding:3px;clip-path:var(--ch);filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.tierbox > *{position:relative}
.tierbox::before{content:"";position:absolute;inset:3px;clip-path:var(--ch);background:linear-gradient(180deg,#07123f,#010416)}
.tb-top{display:flex;justify-content:space-between;gap:8px;padding:7px 12px 0;font-family:var(--disp);font-weight:700;font-size:15px}
.tb-top span:first-child{color:var(--gold)}
.tb-prize{padding:0 12px;font-family:var(--num);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:.02em;background:linear-gradient(180deg,#fffbe6,#ffe27a 40%,#f5c542 52%,#c98a14);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(245,197,66,.55))}
.tb-cells{display:flex;gap:4px;padding:6px 12px 10px}
.tb-cells i{position:relative;flex:1;height:16px;transform:skewX(-16deg);background:rgba(95,160,255,.1);box-shadow:inset 0 0 0 1px rgba(95,160,255,.45);display:grid;place-items:center;font-style:normal;font-family:var(--num);font-size:10px;font-weight:700;color:rgba(200,220,255,.6)}
.tb-cells i span{transform:skewX(16deg)}
.tb-cells i.cur{background:var(--goldgrad);color:#2a1800;box-shadow:0 0 12px rgba(245,197,66,.8);animation:cellCur 1s ease-in-out infinite}
.tb-cells i.done{background:linear-gradient(180deg,#b8ffa8,#1fbf45);color:#053016;box-shadow:0 0 10px rgba(141,255,110,.7)}
.tb-cells i.fill{animation:cellFill .7s cubic-bezier(.2,1.6,.3,1)}
.tb-cells i.lost{background:linear-gradient(180deg,#ff8a7a,#8a0c16);color:#fff}
@keyframes cellCur{50%{filter:brightness(1.35)}}
@keyframes cellFill{0%{transform:skewX(-16deg) scaleY(2.4);filter:brightness(3)}100%{transform:skewX(-16deg)}}
.tierbox.flip{animation:tbFlip .8s cubic-bezier(.2,1.3,.3,1)}
@keyframes tbFlip{0%{transform:perspective(500px) rotateX(90deg)}100%{transform:none}}
/* timer ignite */
.thouse .chase{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(45deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%);background-size:300% 300%}
.thouse.ignite{animation:ign 1.1s ease-out}
.thouse.ignite .chase{animation:chase .9s ease-out}
.thouse.ignite .seg7 polygon.on{animation:flick .7s steps(7)}
.thouse.ignite .disp{animation:dispPop .6s cubic-bezier(.2,1.6,.3,1)}
@keyframes ign{0%{filter:brightness(1)}18%{filter:brightness(2.3)}100%{filter:brightness(1)}}
@keyframes chase{0%{opacity:1;background-position:0% 100%}100%{opacity:0;background-position:100% 0%}}
@keyframes flick{0%,30%,60%{opacity:.08}15%,45%,100%{opacity:1}}
@keyframes dispPop{0%{transform:scale(.6)}100%{transform:none}}
.tgo{position:absolute;right:0;bottom:170px;width:186px;text-align:center;font-family:var(--disp);font-weight:800;font-style:italic;font-size:34px;color:#fff4b8;text-shadow:0 3px 0 #7a4f08,0 0 20px #f5c542;opacity:0;pointer-events:none}
.tgo.go{animation:goPop 1.1s cubic-bezier(.2,1.5,.3,1) forwards}
@keyframes goPop{0%{opacity:0;transform:translateY(30px) scale(.4)}25%{opacity:1;transform:translateY(-6px) scale(1.2)}70%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-30px)}}

/* ---------- PRIZE FX ---------- */
#prizeFX{position:fixed;inset:0;z-index:37;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px;padding-bottom:120px;text-align:center}
#prizeFX .pfx-glow{position:absolute;inset:0;background:radial-gradient(50% 40% at 50% 45%,rgba(245,197,66,.35),rgba(3,8,36,.55) 70%);animation:pfxFade .8s both}
#prizeFX .pfx-rays{position:absolute;left:50%;top:45%;width:1400px;height:1400px;margin:-700px 0 0 -700px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,140,.2) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);animation:spin 14s linear infinite,pfxFade 1s both}
@keyframes pfxFade{from{opacity:0}to{opacity:1}}
#prizeFX > div:not(.pfx-rays):not(.pfx-glow){position:relative}
.pfx-title{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(26px,4.5vw,48px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4),0 0 24px rgba(95,160,255,.8);animation:pfxDrop .7s cubic-bezier(.2,1.5,.3,1) both}
.pfx-label{margin-top:6px;font-family:var(--num);letter-spacing:.4em;font-size:clamp(12px,1.6vw,16px);color:#fff4b8;animation:pfxDrop .7s .15s cubic-bezier(.2,1.5,.3,1) both}
@keyframes pfxDrop{from{opacity:0;transform:translateY(-40px) scale(1.4)}to{opacity:1;transform:none}}
.pfx-stage{perspective:900px;margin:8px 0 4px}
.pfx-3d{position:relative;display:inline-block;font-family:var(--num);font-weight:700;font-size:clamp(64px,14vw,176px);line-height:1;letter-spacing:.01em;transform-style:preserve-3d;animation:pfxIn 1.1s .25s cubic-bezier(.2,1.25,.3,1) both,pfxSway 5s 1.4s ease-in-out infinite}
.pfx-3d .bk{display:block;color:#e2a82a;text-shadow:0 1px 0 #d59b22,0 2px 0 #c98f1c,0 3px 0 #bd8418,0 4px 0 #b07914,0 5px 0 #a36e11,0 6px 0 #96630e,0 7px 0 #89580c,0 8px 0 #7c4e0a,0 9px 0 #6f4408,0 10px 0 #623b06,0 11px 0 #553205,0 12px 0 #482a04,0 14px 10px rgba(0,0,0,.55),0 26px 40px rgba(0,0,0,.6),0 0 60px rgba(245,197,66,.45)}
.pfx-3d .fr{position:absolute;left:0;top:0;white-space:nowrap;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%),linear-gradient(180deg,#fffdf0 0%,#fff0a8 22%,#f7cf4e 46%,#c98a14 50%,#f5c542 62%,#ffe89a 100%);background-size:260% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pfxShine 2.4s 1.2s ease-in-out infinite}
@keyframes pfxShine{0%{background-position:160% 0,0 0}60%,100%{background-position:-60% 0,0 0}}
@keyframes pfxIn{0%{opacity:0;transform:rotateX(95deg) scale(.2) translateY(80px)}55%{opacity:1;transform:rotateX(-14deg) scale(1.12)}100%{opacity:1;transform:rotateX(12deg) rotateY(-10deg)}}
@keyframes pfxSway{0%,100%{transform:rotateX(12deg) rotateY(-10deg)}50%{transform:rotateX(8deg) rotateY(10deg) translateY(-6px)}}
.pfx-3d.stamp{animation:pfxStamp .6s cubic-bezier(.2,1.8,.3,1),pfxSway 5s .6s ease-in-out infinite}
@keyframes pfxStamp{0%{transform:rotateX(12deg) rotateY(-10deg) scale(1.3);filter:brightness(1.8)}100%{transform:rotateX(12deg) rotateY(-10deg) scale(1)}}
.pfx-sub{font-family:var(--disp);font-weight:600;font-size:clamp(15px,2vw,20px);color:#d6e0ff;text-shadow:0 2px 8px #000;animation:pfxDrop .7s .5s both}
#prizeFX.zero .bk{color:#8a93b8;text-shadow:0 1px 0 #7a83a8,0 2px 0 #6c7598,0 3px 0 #5e6788,0 4px 0 #505978,0 5px 0 #434b68,0 6px 0 #363e58,0 7px 0 #2a3148,0 10px 20px rgba(0,0,0,.6)}
#prizeFX.zero .fr{background:linear-gradient(180deg,#ffffff,#c9d0e8 45%,#7a83a8 52%,#dfe4f5);-webkit-background-clip:text;background-clip:text}
#prizeFX.zero .pfx-rays{display:none}
#prizeFX.zero .pfx-glow{background:radial-gradient(50% 40% at 50% 45%,rgba(255,60,60,.25),rgba(3,8,36,.6) 70%)}
.endcard{top:auto;left:0;right:0;margin-inline:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:none;width:min(440px,calc(100% - 32px))}
.endcard .in{padding:14px 18px}
.endcard .et{font-size:20px}
@media (max-width:860px){
  .toprow{display:contents}
  .band > #status{order:0}.toprow .tabs3{order:1;align-self:flex-start;margin-left:12px;margin-bottom:-4px}.band > .bar{order:2}.toprow .lls{order:3;justify-self:auto;align-self:center;padding:8px 0 6px;background:transparent}
  .tr-sp{display:none}
  .bar{grid-template-columns:minmax(0,1fr)}
  .tierbox{order:0;justify-self:start;display:flex;align-items:center;gap:6px;padding:3px}
  .tb-top{padding:6px 0 6px 10px;flex-direction:column;gap:0;font-size:12px}
  .tb-prize{font-size:20px;padding:0 4px}
  .tb-cells{padding:0 10px 0 4px;width:90px}
  .tb-cells i{height:12px}
  .tgo{bottom:auto;top:-40px;width:128px;font-size:26px}
}

/* ===== v5: choice tabs rise out of the bar ===== */
.tabs3 .slot{opacity:0;transform:translateY(64px);clip-path:inset(100% -90px -20px -90px);transition:opacity .3s,transform .35s,clip-path .35s}
.tabs3.shown .slot,.tabs3.shown .s2{animation:slotRise .75s cubic-bezier(.2,1.25,.3,1) both;animation-delay:var(--d,0s)}
@keyframes slotRise{0%{opacity:1;transform:translateY(64px);clip-path:inset(100% -90px -20px -90px)}55%{transform:translateY(-12px);clip-path:inset(-260px -90px -20px -90px)}100%{opacity:1;transform:none;clip-path:inset(-260px -90px -20px -90px)}}
.tabs3 .s1{--bc:rgba(141,255,110,.9)}.tabs3 .s3{--bc:rgba(255,106,82,.9)}.tabs3 .s2{--bc:rgba(255,244,184,.9)}
.tabs3.shown .slot::before{left:50%;top:auto;bottom:0;width:130%;height:250px;margin:0;border-radius:0;transform-origin:bottom;background:linear-gradient(0deg,var(--bc) 0%,transparent 100%);-webkit-mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);animation:beam 1s ease-out both;animation-delay:calc(var(--d,0s) + .08s)}
@keyframes beam{0%{opacity:0;transform:translateX(-50%) scaleY(0)}30%{opacity:1;transform:translateX(-50%) scaleY(1)}100%{opacity:0;transform:translateX(-50%) scaleY(1.25)}}
.atab > span{position:relative}
.atab .tx{font:inherit;display:inline-block;white-space:nowrap}
.atab .tx .w{display:inline-block;white-space:nowrap}
.atab .lt{display:inline-block;white-space:pre}
.tabs3.shown .atab .lt{animation:ltIn .6s cubic-bezier(.2,1.8,.3,1) both,ltGlow 2.4s ease-in-out infinite}
@keyframes ltIn{0%{opacity:0;transform:translateY(-54px) scale(2.3) rotate(-24deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
@keyframes ltGlow{0%,100%{text-shadow:0 3px 0 rgba(0,0,0,.35)}50%{text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 16px rgba(255,255,255,.95),0 0 32px rgba(255,244,184,.8)}}
.tabs3.shown .atab > span::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.6) 50%,transparent 65%);transform:translateX(-120%);animation:sheen 2.6s 1.2s ease-in-out infinite;pointer-events:none}

/* ===== v5: question number card ===== */
#qcard .in2{padding:10px clamp(34px,6vw,70px) 12px}
#qcard b{font-size:clamp(56px,10vw,120px)}
#qcard b .w{display:inline-block;white-space:nowrap}
#qcard b .c{display:inline-block;white-space:pre;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:qcL .55s cubic-bezier(.2,1.8,.3,1) both}
#qcard b{text-shadow:none;filter:drop-shadow(0 5px 0 #3a2400) drop-shadow(0 0 22px rgba(245,197,66,.7))}
@keyframes qcL{0%{opacity:0;transform:scale(3.2) translateY(-24px);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
#qcard.show{animation:qcIn 1.6s cubic-bezier(.2,.9,.3,1) forwards}
#qcard .streak{position:absolute;left:50%;top:50%;width:140vw;height:6px;margin-left:-70vw;background:linear-gradient(90deg,transparent,#fff4b8 45%,#fff 50%,#fff4b8 55%,transparent);opacity:0;z-index:-1}

/* ===== v5: timer housing rises + lamps ===== */
.thouse{transition:transform .55s cubic-bezier(.2,1.5,.3,1),opacity .3s}

.thouse .lbl{top:146px}

@keyframes lampOff{0%{transform:scale(2.2);background:#fff;box-shadow:0 0 20px #fff}100%{transform:scale(1)}}
.thouse.low .lamps i.on{background:radial-gradient(circle,#fff,#ff5a4a 55%,#b0131f);box-shadow:0 0 10px #ff3b3b,0 0 18px rgba(255,40,40,.8)}
.thouse.ignite .lamps i{animation:lampOn .35s both}
.thouse.ignite .lamps i:nth-child(1){animation-delay:.15s}.thouse.ignite .lamps i:nth-child(2){animation-delay:.25s}.thouse.ignite .lamps i:nth-child(3){animation-delay:.35s}.thouse.ignite .lamps i:nth-child(4){animation-delay:.45s}.thouse.ignite .lamps i:nth-child(5){animation-delay:.55s}
@keyframes lampOn{0%{transform:scale(0);background:#2a1d05}60%{transform:scale(1.9);background:#fff;box-shadow:0 0 22px #fff4b8}100%{transform:scale(1)}}
.seg7.flip .dg{animation:dgFlip .42s cubic-bezier(.2,1.4,.3,1)}
@keyframes dgFlip{0%{transform:perspective(220px) rotateX(-100deg);filter:brightness(3)}100%{transform:none}}
.thouse.tick .disp{animation:dispTick .45s ease-out}
@keyframes dispTick{0%{box-shadow:inset 0 0 0 2px #fff4b8,0 0 26px #ffc94a}100%{box-shadow:inset 0 0 0 2px #3a2800}}
.thouse.low.tick .disp{animation-name:dispTickR}
@keyframes dispTickR{0%{box-shadow:inset 0 0 0 2px #ffb0a0,0 0 30px #ff3b3b}100%{box-shadow:inset 0 0 0 2px #3a2800}}
#bigCount{position:fixed;left:50%;top:40%;z-index:33;pointer-events:none;font-family:var(--num);font-weight:700;font-size:clamp(140px,30vw,320px);line-height:1;color:transparent;-webkit-text-stroke:4px rgba(255,201,74,.85);text-shadow:0 0 40px rgba(245,197,66,.6);opacity:0;transform:translate(-50%,-50%)}
#bigCount.red{-webkit-text-stroke-color:rgba(255,80,70,.95);text-shadow:0 0 50px rgba(255,40,40,.8)}
#bigCount.go{animation:bigC .95s cubic-bezier(.2,1,.3,1) forwards}
@keyframes bigC{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}18%{opacity:.95;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.72)}}
body[data-view="host"] #bigCount{display:none}

/* ===== v5: floor cleared ===== */
#tierFX{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:41;pointer-events:none;text-align:center;opacity:0;width:calc(100% - 32px)}
#tierFX.go{animation:tfWrap 3.2s forwards}
@keyframes tfWrap{0%{opacity:0}5%{opacity:1}86%{opacity:1}100%{opacity:0}}
#tierFX .tf-rays{position:absolute;left:50%;top:50%;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,140,.22) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 58%);mask:radial-gradient(circle,#000 10%,transparent 58%);animation:spin 9s linear infinite;opacity:0;z-index:-1}

.tf-main{position:relative;display:inline-block;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(60px,12vw,150px);line-height:1.12;white-space:nowrap}
.tf-main .w{display:inline-block;white-space:nowrap}

.tf-gold{position:absolute;left:0;top:0;right:0;bottom:0;clip-path:inset(0 100% 0 0);filter:drop-shadow(0 5px 0 #5a3a06) drop-shadow(0 0 26px rgba(245,197,66,.9))}
.tf-gold .c{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}

.tf-bar{position:absolute;top:-12%;bottom:-12%;width:18px;left:0;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 30px #fff4b8,0 0 70px #f5c542;opacity:0;transform:skewX(-14deg)}
#tierFX.go .tf-bar{animation:tfBar .9s .85s cubic-bezier(.7,0,.3,1) forwards}
@keyframes tfBar{0%{left:0;opacity:1}90%{opacity:1}100%{left:100%;opacity:0}}
#tierFX.go .tf-main{animation:tfPulse .5s 1.75s cubic-bezier(.2,1.8,.3,1)}
@keyframes tfPulse{50%{transform:scale(1.1)}}
.tf-sub{margin-top:6px;font-family:var(--disp);font-weight:800;font-size:clamp(20px,3.2vw,34px);background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2400);opacity:0}
#tierFX.go .tf-sub{animation:pfxDrop .6s 1.7s cubic-bezier(.2,1.5,.3,1) both}

@media (max-width:860px){

}

/* ===== v6 ===== */

/* 3D question number, no plate */
#qcard .q3d{position:relative;display:inline-block;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(72px,13vw,168px);line-height:1.2;white-space:nowrap;padding:0 .15em}

#qcard .q3d .fr::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);mix-blend-mode:overlay;transform:translateX(-120%);animation:sheen 1.4s .7s ease-in-out}
#qcard.show{animation:qcIn2 1.9s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes qcIn2{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}74%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,130%) scale(.4)}}
#qcard.show .q3d{animation:q3dIn 1.9s cubic-bezier(.2,1,.3,1) both}
@keyframes q3dIn{0%{transform:perspective(900px) rotateX(75deg) rotateY(-35deg)}28%{transform:perspective(900px) rotateX(-8deg) rotateY(10deg)}60%,100%{transform:perspective(900px) rotateX(14deg) rotateY(-12deg)}}
#qcard.fin .q3d .bk{text-shadow:0 1px 0 #c98e18,0 2px 0 #bb8214,0 3px 0 #ad7611,0 4px 0 #9e6a0e,0 5px 0 #8f5e0b,0 6px 0 #7f5209,0 7px 0 #6f4607,0 8px 0 #5f3b05,0 9px 0 #4f3004,0 10px 0 #8a0c16,0 12px 0 #5a0810,0 16px 18px rgba(0,0,0,.6),0 0 50px rgba(255,60,60,.8)}

/* ===== v7: question number intro ===== */
#qcard{top:40%}
#qcard .qrow{position:relative;display:flex;align-items:center;gap:.08em;white-space:nowrap}
#qcard .q3d.qw{font-size:clamp(50px,8.5vw,110px)}
#qcard .q3d.qn{font-size:clamp(110px,19vw,240px);min-width:.7em;text-align:center}
#qcard .q3d.qn .bk,#qcard .q3d.qn .fr{font-family:var(--num);font-style:normal}
#qcard .q3d.qn .fr{background:linear-gradient(180deg,#fffdf0 0%,#fff0a8 25%,#f7cf4e 48%,#c98a14 52%,#f5c542 64%,#ffe89a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#qcard.show{animation:qcIn3 2.1s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes qcIn3{0%{opacity:0;transform:translate(-50%,-50%)}6%{opacity:1}76%{opacity:1;transform:translate(-50%,-50%) scale(1);filter:none}100%{opacity:0;transform:translate(-50%,-50%) scale(2.3);filter:blur(14px)}}
#qcard.show .q3d.qw{animation:qwIn 1.2s cubic-bezier(.2,1.1,.3,1) both}
@keyframes qwIn{0%{opacity:0;transform:perspective(800px) translateX(-55vw) skewX(-30deg) rotateY(50deg)}45%{opacity:1;transform:perspective(800px) translateX(18px) skewX(6deg) rotateY(-6deg)}70%,100%{opacity:1;transform:perspective(800px) rotateY(12deg) rotateX(10deg)}}
#qcard.show .q3d.qn{animation:qnIn 1.3s .2s cubic-bezier(.2,1,.3,1) both}
@keyframes qnIn{0%{opacity:0;transform:perspective(800px) translateY(-60vh) rotateX(-90deg) scale(1.5)}35%{opacity:1}55%{transform:perspective(800px) translateY(0) rotateX(14deg) scale(1.18)}70%{transform:perspective(800px) rotateX(-6deg) scale(.95)}85%,100%{opacity:1;transform:perspective(800px) rotateX(10deg) rotateY(-14deg) scale(1)}}
#qcard .qring{position:absolute;left:62%;top:50%;width:230px;height:230px;border-radius:50%;border:7px solid #fff4b8;box-shadow:0 0 30px #f5c542,inset 0 0 30px #f5c542;opacity:0;transform:translate(-50%,-50%) scale(.2)}
#qcard.show .qring{animation:qring .9s .78s ease-out both}
@keyframes qring{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}
#qcard .beam{position:absolute;left:50%;top:50%;width:170vw;height:12px;margin:-6px 0 0 -85vw;background:linear-gradient(90deg,transparent,rgba(255,244,184,.95) 50%,transparent);opacity:0;z-index:-1}
#qcard .beam.b1{--r:-16deg}#qcard .beam.b2{--r:16deg}
#qcard.show .beam{animation:beamX 1.2s .72s ease-out both}
@keyframes beamX{0%{opacity:0;transform:rotate(var(--r)) scaleX(.05)}20%{opacity:1;transform:rotate(var(--r)) scaleX(1)}100%{opacity:0;transform:rotate(calc(var(--r) * 1.6)) scaleX(1)}}
#qcard .qsparks{position:absolute;left:62%;top:50%;width:0;height:0}
#qcard .qsparks i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:#fff4b8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;filter:drop-shadow(0 0 6px #f5c542)}
#qcard.show .qsparks i{animation:spk .95s .8s ease-out both}
@keyframes spk{0%{opacity:1;transform:rotate(var(--a)) translateX(10px) scale(1.4)}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.3)}}

/* ===== v7: character select ===== */
.csel{position:fixed;inset:0;z-index:46;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 22px);box-sizing:border-box;background:radial-gradient(40% 50% at 50% 55%,transparent 40%,rgba(2,6,24,.75) 100%);animation:pfxFade .5s both}
.cs-head{text-align:center}
.cs-head h2{margin:6px 0 4px;font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(30px,5vw,54px);background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a2400) drop-shadow(0 0 18px rgba(245,197,66,.5))}
.cs-head p{margin:0;color:#d6e0ff;text-shadow:0 2px 6px #000}
.cs-row{flex:1;width:min(1100px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,1.1fr) minmax(0,1fr);align-items:center;gap:16px}
.cs-stage{position:relative;height:100%;min-height:200px}
.cs-spot{position:absolute;left:50%;bottom:8%;width:260px;height:60px;margin-left:-130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,184,.35),transparent);filter:blur(4px)}
.cs-card{position:relative;justify-self:center;width:min(230px,100%);aspect-ratio:23/32;max-width:100%;perspective:600px;transition:transform .35s cubic-bezier(.2,1.4,.3,1)}
.cs-card[data-g="m"]{animation:csL .7s .1s cubic-bezier(.2,1.2,.3,1) both}.cs-card[data-g="f"]{animation:csR .7s .2s cubic-bezier(.2,1.2,.3,1) both}
@keyframes csL{from{opacity:0;transform:translateX(-60px) rotateY(40deg)}to{opacity:1;transform:none}}
@keyframes csR{from{opacity:0;transform:translateX(60px) rotateY(-40deg)}to{opacity:1;transform:none}}
.cs-card:hover{transform:translateY(-6px) rotateY(var(--ry,0deg))}
.cs-card[data-g="m"]:hover{--ry:8deg}.cs-card[data-g="f"]:hover{--ry:-8deg}
.cs-ring{position:absolute;inset:-5px;clip-path:var(--ch);background:var(--goldgrad)}
.cs-card.on .cs-ring{background:conic-gradient(from var(--ang,0deg),#fff4b8,#f5c542,#5fe3ff,#8dff6e,#f5c542,#fff4b8);animation:ringSpin 2.4s linear infinite;filter:drop-shadow(0 0 16px rgba(245,197,66,.8))}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ringSpin{to{--ang:360deg}}
.cs-in{position:absolute;inset:0;clip-path:var(--ch);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:14px 10px 18px;background:var(--diam),linear-gradient(180deg,#1a47c9,#050f3e 75%);background-size:34px 34px,auto;overflow:hidden}
.cs-in svg{width:78%;height:auto;flex:1;min-height:0;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));transition:transform .4s cubic-bezier(.2,1.4,.3,1)}
.cs-card.on .cs-in svg{transform:scale(1.06)}
.cs-in b{font-family:var(--disp);font-weight:800;font-size:clamp(22px,3vw,32px)}
.cs-in small{font-family:var(--num);letter-spacing:.3em;font-size:11px;color:var(--gold)}
.cs-card:not(.on) .cs-in{filter:saturate(.55) brightness(.75)}
.cs-in::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%)}
.cs-card.on .cs-in::after{animation:sheen 2.4s ease-in-out infinite}
.cs-ok{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--goldgrad);display:grid;place-items:center;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.8,.3,1)}
.cs-ok svg{width:22px;height:22px}
.cs-card.on .cs-ok{transform:scale(1)}
.cs-go{font-size:22px;padding:14px 46px;animation:pfxDrop .6s .35s both}
@media (max-width:700px){
  .cs-row{grid-template-columns:1fr 1fr;grid-template-rows:1fr auto}
  .cs-stage{grid-column:1/-1;grid-row:1}
  .cs-card{width:min(150px,100%)}
}
